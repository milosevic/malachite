[package]
name = "arc-malachitebft-discovery"
description = "Discovery protocol for the Malachite BFT consensus engine"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
readme = "../../../README.md"

[features]
test-utils = []
# Quint Studio oracle instrumentation. Off by default: without it neither the
# oracle client nor any of the `crate::oracle` helpers are compiled.
quint-oracle-enabled = ["dep:quint-oracle", "quint-oracle/enabled"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
malachitebft-metrics = { workspace = true }
libp2p = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
either = { workspace = true }
rand = { workspace = true }
eyre = {workspace = true}
quint-oracle = { path = "../../../quint-specs/oracle-client/rust", optional = true }
