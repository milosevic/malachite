[package]
name = "arc-malachitebft-signing-ed25519"
description = "Ed25519 signing scheme for the Malachite BFT consensus engine"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "../../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
std = []
serde = ["dep:serde", "dep:base64"]
rand = ["dep:rand"]
zeroize = ["dep:zeroize"]
# Quint Studio oracle instrumentation for the SigningScheme decoders. Off by default,
# so `no_std` and production builds compile none of it.
quint-oracle = ["dep:quint-oracle", "malachitebft-signing/quint-oracle"]

[dependencies]
malachitebft-core-types = { workspace = true }

signature = { workspace = true }
ed25519-consensus = { workspace = true }

quint-oracle = { path = "../../../quint-specs/oracle-client/rust", optional = true }
malachitebft-signing = { workspace = true, optional = true }

# Optional dependencies
rand = { workspace = true, optional = true }   # rand
serde = { workspace = true, optional = true }  # serde
base64 = { workspace = true, optional = true } # serde
zeroize = { workspace = true, optional = true } # zeroize

[lints]
workspace = true
