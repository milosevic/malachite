[package]
name = "arc-malachitebft-test"
description = "Testing framework for the Malachite consensus engine"
publish = false

version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
malachitebft-engine = { workspace = true }
malachitebft-engine-byzantine = { workspace = true }
malachitebft-app = { workspace = true }
malachitebft-codec = { workspace = true }
malachitebft-core-types = { workspace = true, features = ["serde"] }
malachitebft-config = { workspace = true }
malachitebft-core-consensus = { workspace = true }
malachitebft-proto = { workspace = true }
malachitebft-peer = { workspace = true, features = ["rand", "serde"] }
# `quint-oracle` gives this crate the shared `signing` identity projection
# (`malachitebft_signing::quint_ids`). The log sites stay inert at runtime unless the
# client's own `enabled` feature is on, which is what the oracle test command passes.
malachitebft-signing = { workspace = true, features = ["quint-oracle"] }
malachitebft-signing-ed25519 = { workspace = true, features = ["rand", "serde"] }
malachitebft-sync = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
ed25519-consensus = { workspace = true }
eyre = { workspace = true }
futures = {workspace = true}
hex = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
libp2p-identity = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
sha3 = { workspace = true }
signature = { workspace = true }
tokio = { workspace = true }

# Quint Studio oracle instrumentation: a no-op unless built with
# `--features quint-oracle/enabled`, so production builds carry none of it.
quint-oracle = { path = "../../../quint-specs/oracle-client/rust" }

[dev-dependencies]
malachitebft-metrics.workspace = true
malachitebft-test-app.workspace = true
malachitebft-test-framework.workspace = true

bytesize.workspace = true
quint-oracle = { path = "../../../quint-specs/oracle-client/rust" }
ractor.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[build-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }

[lints]
workspace = true
