[package]
name = "arc-malachitebft-signing-ecdsa"
description = "Generic ECDSA signing scheme utilities for the Malachite BFT consensus engine"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "../../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["k256"]
std = []
serde = ["dep:serde", "dep:base64"]
rand = ["dep:rand"]
k256 = ["dep:k256"]
p256 = ["dep:p256"]
p384 = ["dep:p384"]
# Quint Studio oracle instrumentation for the SigningScheme decoders. Off by default,
# so `no_std` and production builds compile none of it.
quint-oracle = ["dep:quint-oracle", "malachitebft-signing/quint-oracle"]

[dependencies]
malachitebft-core-types = { workspace = true }
signature = { workspace = true }
k256 = { workspace = true, optional = true, features = ["ecdsa"] }
p256 = { workspace = true, optional = true, features = ["ecdsa"] }
p384 = { workspace = true, optional = true, features = ["ecdsa"] }

quint-oracle = { path = "../../../quint-specs/oracle-client/rust", optional = true }
malachitebft-signing = { workspace = true, optional = true }

# Optional dependencies
rand = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive", "alloc"] }
base64 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
