    "Amnesia: prevoting a value after having locked another — the direct attack on the locking rule, and the one that should break agreement if the guard is wrong",
    "Forcing a nil precommit despite a polka, attacking liveness rather than safety",
    "Dropping inbound proposals so the node's FullProposalKeeper never sees what the rest of the network saw (config.rs:65)",
    "A nil vote cannot be equivocated without conflicting_vote_value_fn (proxy.rs:480) — a gap in the attack surface",
    "Probabilistic triggers making a failing run hard to reproduce without the seed",
]
