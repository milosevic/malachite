[[components.vote-keeper.hardToReproduce]]
revision = 3
kind = "code"
problem = """
The violation is REAL and already reproduced, but this batch offers no lane that can record it. Counterexample (seed 1788010541238283420): validator 0 equivocates twice in round 1 — precommit \"0\" then precommit \"2\", then prevote \"2\" then prevote Nil — leaving evidence[0].length() == 2, breaking `evidence_bounded_per_validator` (quint-specs/vote-keeper.qnt:564). Code confirms it: `EvidenceMap::add` (code/crates/core-votekeeper/src/evidence.rs:43-63) dedupes only an exact repeat of an already-stored ordered pair and otherwise `evidence.push((existing, conflicting))` into an unbounded `Vec<DoubleVote<Ctx>>` per address; `VoteKeeper::apply_vote` (code/crates/core-votekeeper/src/keeper.rs:385) calls it on every `RecordVoteError::ConflictingVote`, and `prune_votes` never touches `self.evidence` — only `take_evidence()` releases it. A flooding equivocator therefore grows keeper memory linearly in the number of distinct conflicting votes it sends.

I wrote the honest property test through the public API only (`apply_vote`, default settings): `evidence_stays_bounded_per_validator` in code/crates/core-votekeeper/tests/vote_keeper.rs (declaration line `fn evidence_stays_bounded_per_validator() {`), asserting `keeper.evidence().get(&addr1).map(|e| e.len()).unwrap_or(0) <= 1`. It FAILS with \"got 2\" — the bug is pinned. It is committed marked `#[ignore]` with a `// reproduces evidence_bounded_per_validator — fails on current code` comment.

The blocker is purely recording: `record_tests` requires an exact ordered family match, and the oracle discards a FAILING test's trace (\"[oracle] test ended: ... failed — discarding its trace\"), so the run reports \"oracle report has no test named 'evidence_stays_bounded_per_validator'\" and no family can ever be supplied. The documented escape hatch for exactly this row — `record_reproduction(..., property: \"evidence_bounded_per_validator\")` — is refused here with \"no active reproduction batch\", because this batch was queued in the violations lane only. So a proven bug with a committed failing test cannot be filed through either lane.

Note the sibling characterization test `repeated_equivocation_grows_evidence_and_survives_prune` (same file) already documents the growth and PASSES, so full-suite runs stay green."""
summary = "A validator that keeps sending conflicting votes gets a new equivocation record kept for each pair, so the vote keeper's memory grows without bound and nothing in the test lane can file the failure."
property = "evidence_bounded_per_validator"
trackNames = ["equivocation_recorded"]

