    "An application that never replies to GetValue, Decided or Finalized — a liveness hang with no error surfaced",
    "An application that replies with a value for the wrong height or round",
    "Duplicate or racing StartHeight/RestartHeight against an in-flight round",
    "A full or closed channel dropping requests silently on try_send",
    "An application that returns Invalid for every vote extension, disabling extension-carrying votes",
]
specHints = "msgs.rs:217-405 is the real protocol surface — the AppMsg enum with its per-variant reply contracts spelled out in doc comments, which is exactly the material for guard conjuncts. builder.rs holds the actor wiring order; connector.rs:53 is the HostMsg-to-AppMsg translation and the single place the request/reply discipline is enforced. app/src/part_store.rs is hashed under proposal-streaming. Modelling this well means modelling the request/reply obligation as a protocol, not the Rust plumbing."
