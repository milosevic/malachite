    "Connector::handle_msg(HostMsg) — callback; translates a HostMsg into an AppMsg over mpsc and awaits the app's oneshot reply (connector.rs:53)",
    "AppMsg::{ConsensusReady, StartedRound, GetValue, ExtendVote, VerifyVoteExtension, RestreamProposal, GetHistoryMinHeight, ReceivedProposalPart, Decided, Finalized, GetDecidedValues, ProcessSyncedValue} — callbacks, each carrying a MUST-reply obligation (msgs.rs:217-405)",
