[[components.wal.productIntent.hazards]]
claim = "It should be impossible to reach a state where an entry is durable in the log but can never be read back."
decidedAt = 1788009242165
decision = "confirmed"
expectations = [
    "`write_entry` applies the same `MAX_ENTRY_SIZE` bound that `read_to_next` applies",
    "`append` returns `Err(InvalidData)` rather than `Ok(())` for `dataLength > MAX_ENTRY_SIZE`",
    "`log.len` stays `4` and the earlier entries remain replayable",
]
headline = "Oversized entry never becomes durable"
id = "oversized-entry-never-becomes-durable"
quint = [
    "val noUnreadableDurableEntry =",
    "  log.entries.forall(e => e.status == Durable implies e.dataLength <= MAX_ENTRY_SIZE)",
]
why = "A single oversized entry poisons the whole log: replay hits Err(InvalidData) and every entry after it is lost."

