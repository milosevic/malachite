    "HostMsg::ConsensusReady / StartedRound / GetValue / ExtendVote / VerifyVoteExtension / RestreamProposal / ReceivedProposalPart / Decided / Finalized / GetHistoryMinHeight / GetDecidedValues / ProcessSyncedValue — callbacks, each with a MUST-reply contract (host.rs:30-100+)",
