    "Node::pre_start(...) — constructor; links the child actors for supervision (node.rs:66-82)",
    "Node::handle_supervisor_evt(...) — callback on child crash or exit (node.rs:94+)",
    "MessageBuffer::buffer / pop — mutates; bounded, drops rather than queues when full (util/msg_buffer.rs:21-32)",
    "TimerScheduler::start_timer / cancel / intercept_timer_msg — mutates; a generation counter rejects stale timeout messages (util/timers.rs:15-26)",
