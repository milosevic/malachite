[[components.wal.productIntent.hazards]]
claim = "It should be impossible to reach a state where consensus broadcasts a message whose WAL append returned an error."
decidedAt = 1788009271043
decision = "confirmed"
expectations = [
    "`wal_append` currently maps `Ok(Err(e))` to a log line and returns `Ok(())`, so `perform!` sees success",
    "the vote reaches the network while `log.len` never grew, so replay after a crash cannot reproduce it",
    "the node can vote differently for the same height and round after restart",
]
headline = "Failed WAL append stops consensus"
id = "failed-wal-append-stops-consensus"
quint = [
    "val noBroadcastWithoutDurableEntry =",
    "  broadcastMessages.forall(m => log.entries.contains(m))",
]
why = "A disk error is swallowed, so the node emits votes it has no record of and can equivocate after a crash — the exact fault the WAL exists to prevent."

