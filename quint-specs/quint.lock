description = "The catch-up protocol: it advertises and reads peer status, requests decided values in batches from score-weighted peers under a parallel-request budget and a read-ahead limit, validates and rescores responses, retries failed ranges against other peers, serves other peers' requests from the local host, and buffers arrived values against the consensus height."
role = "peripheral"
rank = 5
paths = [
    "code/crates/sync/src/handle.rs",
    "code/crates/sync/src/state.rs",
    "code/crates/sync/src/effect.rs",
    "code/crates/sync/src/scoring.rs",
    "code/crates/sync/src/scoring/ema.rs",
    "code/crates/sync/src/scoring/metrics.rs",
    "code/crates/sync/src/types.rs",
    "code/crates/sync/src/config.rs",
    "code/crates/sync/src/co.rs",
    "code/crates/sync/src/rpc.rs",
    "code/crates/sync/src/behaviour.rs",
    "code/crates/sync/src/macros.rs",
    "code/crates/sync/src/metrics.rs",
    "code/crates/sync/src/lib.rs",
    "code/crates/engine/src/sync.rs",
]
tests = [
    "code/crates/test/tests/it/value_sync.rs",
    "code/crates/test/tests/unit/sync.rs",
]
dependencies = [
    "p2p-network",
    "consensus-orchestrator",
    "core-types-domain",
]
operations = [
    "State::new(rng, config) — constructor",
    "on_send_status_update(co, state, metrics) — mutates (broadcasts status, prunes inactive peer scores) (handle.rs:179)",
    "on_status(co, state, metrics, status) — guarded mutation; requests only if started and peer_height >= sync_height (handle.rs:206-228)",
    "on_started_height(co, state, metrics, height, start_type) — mutates; sets tip_height = height-1, prunes/clears pending (handle.rs:244-269)",
    "on_decided(state, metrics, height) — mutates; advances tip_height and re-validates sync_height (handle.rs:281)",
    "on_value_request(co, state, metrics, ...) — guarded mutation; validate_request_range then clamp to tip (handle.rs:311, 359-391)",
    "on_value_response(...) — guarded mutation; checks request_id, peer identity, range and height contiguity (handle.rs:105-169)",
    "on_valid_value_response(...) — mutates; scores the peer, forwards ProcessValueResponse, re-requests the remainder on a partial response (handle.rs:409-488)",
    "on_invalid_value_response(...) — mutates; scores Failure and re-requests from another peer (handle.rs:495)",
    "on_got_decided_values(...) — mutates; truncates at the first non-contiguous height, sends the response (handle.rs:516-563)",
    "on_sync_request_timed_out(...) — mutates; scores Timeout and retries excluding that peer (handle.rs:580)",
    "on_invalid_value(...) / on_value_processing_error(...) — mutates (handle.rs:607, 621)",
    "request_values / request_values_range — guarded mutation; bounded by max_parallel_requests (handle.rs:666-710)",
    "re_request_values_from_peer_except(...) — mutates; accumulates excluded_peers, resets sync_height when peers are exhausted (handle.rs:877-925)",
    "set_sync_height(...) — mutates, enforcing sync_height > tip_height and not inside a pending range (handle.rs:950)",
    "PeerScorer::update_score / update_score_with_metrics — mutates",
    "ExponentialMovingAverage::update_score(prev, result) — query (pure, into [0,1]) (scoring/ema.rs:92)",
    "engine sync actor handle_msg(Msg) — mutates; NetworkEvent/StartedHeight/Decided/GotDecidedValues/TimeoutElapsed/InvalidValue/ValueProcessingError (engine/src/sync.rs:460)",
    "process_value_response(...) — mutates; buffers or forwards against consensus_height, bounded queue drops when full (engine/src/sync.rs:397-423)",
]
headlineProperties = [
    "sync_height is always strictly greater than tip_height (state.rs:41, enforced by set_sync_height)",
    "sync_height never falls inside the range of an open request",
    "A request is only sent to a peer whose advertised tip covers the requested height",
    "A response is accepted only from the exact peer and range it was requested from; otherwise the peer is rescored and the range re-requested",
    "excluded_peers grows monotonically across retries of one range until every peer has been tried",
]
adversarySurface = [
    "Response for an unknown or stale request_id — silently dropped (handle.rs:116)",
    "Response arriving from a different peer than the one recorded — treated as invalid and re-requested (handle.rs:123)",
    "Truncated/partial response — accepted, scored lower, remainder re-requested (handle.rs:141, 467)",
    "Non-contiguous certificate heights — rejected as invalid (handle.rs:154, 169)",
    "Peer advertises a false tip in its Status — used directly for peer selection; certificate validity is only checked downstream (state.rs:114-145)",
    "Request timeout — peer scored down and retried excluding it (handle.rs:580)",
    "A misbehaving local host returns the wrong number or heights of decided values — truncated to the valid prefix (handle.rs:544-563)",
    "Concurrent decides racing in-flight requests over the sync_height rewind (the subject of fix 5cd137fb)",
]
specHints = "handle.rs:57 handle() has 9 input variants; State at state.rs:22 holds consensus_height, tip_height, sync_height, pending_requests, peers, peer_scorer. set_sync_height at handle.rs:939-965 enforces the invariants. Peer scoring (scoring/ema.rs:92-153) is folded in here: PeerScorer lives inside sync::State and has no other caller. engine/src/sync.rs:176-220 is the actor wrapper. Rich existing spec suite at specs/synchronization/valuesync/quint/ (valuesync, valuesyncClient, valuesyncServer, vsyncStatemachine, vsyncWithConsensus, vsyncWithMockedConsensus) with no ITF replay wired yet; client and server split cleanly."
cardRead = false
connectionsRead = false
spec = "quint-specs/value-sync.qnt"
version = 2
observationsConfirmed = true
propertiesConfirmed = true
confirmedObservations = [
