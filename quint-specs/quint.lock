[[components.round-state-machine.productIntent.goals]]
claim = "It should be possible to prevote a value we are not locked on, when the proposal carries a polka from a round at or above our lock round."
decidedAt = 1788009824762
decision = "confirmed"
expectations = [
    "`prevote_previous` tests `locked.round <= vr` before it ever compares values, so the lock on `w` does not force a nil prevote",
    "`state.locked` is left untouched — only a later `precommit` re-locks",
]
headline = "Locked node unlocks for an older polka"
id = "locked-node-unlocks-for-an-older-polka"
quint = [
    "run unlockOnOlderPolka =",
    "  init.then(applyProposalAndPolkaPrevious(proposal))",
    "    .expect(output == Prevote(Val(proposal.value)))",
]
why = "This is the liveness half of the locking rule: without it a node locked on a stale value can never join the polka that actually formed."

