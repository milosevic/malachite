[[behaviorTests.rows]]
behaviorId = "unanimous-nil-precommits-are-distinguishable-from-a-split-quorum"
component = "vote-keeper"
headline = "Unanimous nil precommits are distinguishable from a split quorum"
kind = "hazard"
note = "precommit_apply_nil pins an all-nil 3/3 precommit quorum to Some(Output::PrecommitAny); precommit_apply_single_value pins the mixed/split quorum to the same value. Any change to the (Precommit, Threshold::Nil) mapping (e.g. adding a PrecommitNil variant) breaks these assertions. The tests lock in the current conflation rather than a distinction, but they do fail if it is changed."
recordedAt = 1788006565930
status = "enforced"

