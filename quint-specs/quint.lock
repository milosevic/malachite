[[components.consensus-orchestrator.productIntent.hazards]]
claim = "It should be impossible to reach a state where the per-round proposal cap rejects a proposal the node needs in order to decide the round"
expectations = [
    "`exceeds_per_round_cap` drops the proposal before signature verification, WAL append, and the keeper, incrementing only `dropped_capped_proposals`",
    "the sole exemption is a proposal whose value already holds a polka certificate, so a value a quorum is converging on but has not yet certified gets no exemption",
    "the cap is per `(height, round)`, so a proposer flooding junk proposals can exhaust it before the honest proposal arrives and force the round to time out",
]
headline = "Capped Round Still Accepts The Decidable Proposal"
id = "capped-round-still-accepts-the-decidable-proposal"
quint = [
    "val cappedRoundStillProgresses =",
    "  proposalRejectedByCap(p) implies",
    "    not(canDecideOn(p.value))",
]
recordedAt = 1789041238528
why = "The WAL-growth cap silently discards proposals for a round and exempts only already-certified values, so an honest proposal arriving late in a flooded round is lost."

