    "peer_fault_penalised_and_retried",
    "transient_error_retried_without_penalty",
    "disconnect_triggered_rerequest",
    "all_peers_exhausted_for_range",
    "exclusion_set_dropped_on_failed_send",
    "read_ahead_limit_blocked_request",
    "parallel_budget_blocked_request",
    "send_failure_rolled_back_sync_height",
    "inbound_request_rejected_as_invalid",
    "inbound_request_clamped_to_tip",
    "host_values_truncated",
    "inactive_peer_scores_reset",
    "value_buffered_ahead_of_consensus",
]
confirmedProperties = [
