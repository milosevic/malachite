    "Flooding with future-height inputs is bounded by the input queue capacity (state.rs:29, 245); overflow silently drops",
    "Restart with a stale WAL replaying votes for a height the node has already moved past",
]
specHints = "handle.rs:27 handle()/handle_input() is the entry; State at state.rs:15 embeds driver + full_proposal_keeper + input_queue + finalization_period. Effect enum at effect.rs:48, Input at input.rs:12. full_proposal.rs mediates the proposal-vs-value race (Entry states ProposalOnly|ValueOnly|Full). finalization_period is a two-phase latch: decide.rs:7 sets it, finalize.rs:3 clears it. handle/sync.rs:23 maybe_sync_decision is the shortcut decision path that bypasses voting. util/bounded_queue.rs backs buffer_input; util/pretty.rs is logging only; gen.rs is macro support; ser.rs belongs to message-codec; oracle.rs is test instrumentation, inert without QUINT_ORACLE_URL. Only partially covered by specs/consensus/quint/statemachineAsync.qnt; quint-specs/consensus-orchestrator.qnt is an in-progress Studio spec."
