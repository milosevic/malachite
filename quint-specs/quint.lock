[systemAnalyses.consensus-orchestrator-wal.result]
format = "quint-system-analysis"
key = "consensus-orchestrator-wal"
version = 1

[systemAnalyses.consensus-orchestrator-wal.result.answer]
analyzed = """
- **Consensus Orchestrator** — quint-specs/consensus-orchestrator.qnt ↔ code/crates/core-consensus/src/handle.rs and handle/*.rs
- **Write-ahead log** — quint-specs/wal.qnt ↔ code/crates/wal/src/log.rs, code/crates/engine/src/wal.rs, code/crates/engine/src/consensus.rs:1141-1167
- **Composed model** — quint-specs/consensus-orchestrator-wal-distributed.qnt, wiring the orchestrator's Effect::WalAppend to the log actor's Msg::Append and the log thread's write, with the vote going on the wire afterwards
- **Search model** — quint-specs/consensus-orchestrator-wal-system.qnt, one orchestrator and one log with the protocol collapsed to publish, flush, crash, damage and start-height"""
answerMd = """
**No.** All three recorded guarantees fail, and both recorded bridge requirements fail with them.

The root cause is a single wiring gap: **a vote reaches the network whether or not its log entry was ever written.** `Effect::WalAppend` is resumed at consensus.rs:1141-1167, which only *logs* the append result — `perform!` resumes and the message is broadcast either way. Underneath, the log actor's `Msg::Append` (wal.rs:107-120) drops the entry outright and answers `Ok(())` when the entry's height does not match the actor's in-memory height. Nothing between the two ever fsyncs before the send.

That single gap breaks each guarantee in turn:

| Guarantee | Result |
|---|---|
| No amnesia | **broken** — a node publishes a prevote for one value, crashes, replays an empty log, and prevotes for a *different* value in the same round |
| Replay fidelity | **broken** — the replay stops at the first entry that no longer reads back and hands back fewer votes than were published |
| Height isolation | **broken** — an entry written under consensus height 1 sits in a log whose sequence number is 0, and the replay for height 0 hands that height-1 vote back |

One guarantee we added held: after a restart the node never applied a logged vote for a height it had already moved past — the log's sequence-mismatch reset covers that, across 20000 sampled runs with the scenario reached 1219 times.

**Three rows were recorded as holding at component level but did not hold when measured under these bounds, alone, before any composition** — so these are not composition findings, they are corrections to the recorded baseline:

- `wal_appends_are_not_duplicated` (orchestrator) — a restart at the same height appends the same prevote twice, because `reset_and_start_height` clears `publishedVotes` but not the append ledger.
- `buffered_inputs_are_future` (orchestrator) — a vote arriving while the driver is still in the Nil round is buffered under the height the node is already on.
- `append_ack_is_honest` (write-ahead log) — `Msg::Append` for a height the actor is not at answers Ok with the log unchanged.

One row recorded as violated did *not* produce a counterexample in the composition: `replay_keeps_later_intact_entries`. Its scenario — a replay discarding later readable entries — was never built in this run, so that row is a measurement gap, not evidence of a fix."""
brokenCount = 13
question = "Does 'Surviving a crash' uphold its recorded guarantees?"

[systemAnalyses.consensus-orchestrator-wal.result.assumptions]
scope = [
    "Exactly one orchestrator and one write-ahead log. Every guarantee in 'Surviving a crash' is about a single node losing its memory, so no second validator is modelled and nothing about agreement across nodes was checked here.",
    "The driver's real greater-than-two-thirds tallying is abstracted by the orchestrator component spec itself (QuorumSize = 1); quorum arithmetic belongs to the driver, vote-keeper and round-state-machine components and was not checked.",
    "Proposals are published but never written to the log, because no action of the log accepts them. The 'and proposals' half of the replay-fidelity statement is therefore judged only on votes; see the interface section.",
    "Vote extensions, signature verification internals, message encoding and the sync path's certificate verification are represented only by the pass/fail flags the component specs already carry.",
    "The composed run drives one write-ahead log file for the actor plus the spare paths the log spec declares; multi-file interactions beyond that were not explored.",
    "The three rows whose measured component-level baseline contradicts the confirmed one (wal_appends_are_not_duplicated, buffered_inputs_are_future, append_ack_is_honest) are reported with their CONFIRMED hypothesis, as the confirm gate fixed it; the measured baseline is stated in the answer and in each explanation.",
]

[[systemAnalyses.consensus-orchestrator-wal.result.assumptions.collapses]]
dischargedBy = "The write-ahead log spec's own consensus_wal_append_and_broadcast action already models the whole Effect::WalAppend resume-and-broadcast sequence as a single action, and Wal_actor_MsgAppend models the height-mismatch drop as a single action. The composed model does not rely on this collapse — it carries the append and the broadcast through the actor and the log thread separately."
what = "In the search model, the append and the broadcast of a vote are one atomic step"

[[systemAnalyses.consensus-orchestrator-wal.result.assumptions.collapses]]
dischargedBy = "The orchestrator's own invariants published_votes_are_wal_logged and wal_appends_are_not_duplicated. Note that wal_appends_are_not_duplicated turned out NOT to hold at component level under the analysis bounds, so this collapse is weaker than intended; the composed model does not use it, and every reported violation was reproduced there against the orchestrator's full imported logic."
what = "In the search model, the orchestrator reduces to 'votes at most once per height and round, and publishes through the log'; routing, vote admission, driver tallying, rounds, the finalization latch and the sync path are not modelled"

[[systemAnalyses.consensus-orchestrator-wal.result.assumptions.collapses]]
dischargedBy = "The log spec's own readable and replayedPayloads helpers, whose net effect on a replay is exactly that prefix. The composed model imports and applies these helpers directly rather than approximating them."
what = "In the search model, byte-level framing, CRCs, entry sizes, headers, truncate/reset/dump and the open scan are reduced to 'a replay returns entries up to the first unreadable one'"

[[systemAnalyses.consensus-orchestrator-wal.result.assumptions.collapses]]
dischargedBy = "Log::flush (log.rs:574), which makes everything written so far durable in one step."
what = "In the search model, flushing is per-log rather than per-entry"

[[systemAnalyses.consensus-orchestrator-wal.result.assumptions.glue]]
adapter = "applyWalAppendAndBroadcast — carries one Effect::WalAppend from the orchestrator to the log actor's Msg::Append and then the log thread's write, and puts the vote on the wire afterwards"
check = "Each of its three branches is exercised by a deterministic run: the drop branch by wal_append_durable_before_publishTest, the successful-write branch by entries_belong_to_the_logs_heightTest, and the broadcast-without-entry consequence by no_broadcast_without_durable_entryTest."
cites = "handle/vote.rs:95-102 (the append is issued), wal.rs:107-120 (Msg::Append and its height-mismatch drop), log.rs:351-436 (write_entry and its write-error branch), consensus.rs:1141-1167 (the reply is logged and the message broadcast regardless)"

[[systemAnalyses.consensus-orchestrator-wal.result.assumptions.glue]]
adapter = "entryVote — a ghost map from a log entry's payload id to the vote that entry carries, so a replayed payload can be read back as a vote"
check = "Observation only: it is written when an entry is created and read only by the guarantees. It appears in no guard of any lifted component action, so it cannot steer the run."
cites = "The log spec's Entry.payload is an opaque identifier assigned from ghost.nextId; it carries no vote fields, so the composed model records the association when the entry is written."

[[systemAnalyses.consensus-orchestrator-wal.result.assumptions.glue]]
adapter = "VOTE_ENTRY_SIZE = 56 — the payload size the orchestrator's vote entries are written with"
check = "No guarantee reads the size except no_unreadable_durable_entry, which is driven separately by an explicit oversized append (no_unreadable_durable_entryTest), so the choice does not affect any reported result."
cites = "The log spec's SIZES domain, which includes 56 as a representative in-range entry size."

