[components.fast-vote-keeper]
name = "Fast Tendermint Vote Keeper"
description = "Tallies the single Fast Tendermint voting step and latches two independent thresholds per round — 2f+1 makes a value valid, n−f decides and advances the round — returning a list of outputs, with equivocating votes diverted to evidence and no SkipRound."
role = "central"
rank = 0
paths = [
    "code/crates/core-votekeeper/src/fast/keeper.rs",
    "code/crates/core-votekeeper/src/fast/params.rs",
    "code/crates/core-votekeeper/src/fast/mod.rs",
]
tests = []
dependencies = [
    "core-types-domain",
    "equivocation-detection",
]
operations = [
    "FastVoteKeeper::new(validator_set, threshold_params) — constructor",
    "FastVoteKeeper::apply_vote(signed_vote) -> Vec<Output> — mutates",
    "FastVoteKeeper::total_weight() — query",
    "FastVoteKeeper::evidence() — query",
    "FastVoteKeeper::has_vote_quorum(round, value_id) -> bool — query (2f+1, L27 justification)",
    "FastVoteKeeper::has_decision_quorum(round, value_id) -> bool — query (n−f, L42)",
    "FastVoteKeeper::prune_votes(min_round) — mutates (evidence is never pruned)",
    "FastThresholdParams::default() / N_MINUS_F (4/5) / TWO_F_PLUS_ONE (2/5) — query",
]
headlineProperties = [
    "Each output kind fires at most once per round per value: VoteQuorumValue(id), DecisionQuorumValue(id) and QuorumAny are latched separately",
    "Crossing 2f+1 never suppresses a later n−f for the same value; one vote may emit both, and VoteQuorumValue is ordered before DecisionQuorumValue",
    "A validator's weight is counted at most once per round (set_once), so equivocation cannot manufacture a quorum",
    "A second conflicting vote from an already-counted validator becomes evidence and is not tallied; the first vote is retained whole",
    "A vote from an address outside the validator set creates no per-round state and yields no output",
    "prune_votes(min_round) drops every round below min_round and leaves evidence intact",
    "QuorumAny is the only round-advancing output — no SkipRound and no f+1 threshold exists",
]
adversarySurface = [
    "Equivocating votes (same validator, same round, different value) — diverted to EvidenceMap",
    "Duplicate identical vote replayed — returns no output, weight not double-counted",
    "Votes from unknown / non-validator addresses",
    "Uneven voting power where a single vote crosses both 2f+1 and n−f at once",
    "Nil votes inflating the quorum-any tally toward n−f without any value reaching a threshold",
    "Votes at arbitrarily high rounds creating unbounded per_round entries",
    "Votes arriving for a round already pruned",
]
specHints = "code/crates/core-votekeeper/src/fast/keeper.rs:100 (apply_vote returns Vec, both thresholds); keeper.rs:118 (equivocation diverted to evidence, first vote kept); keeper.rs:139 (L36 then L42 ordering); keeper.rs:157 (L39 quorum-any over addresses_weights); fast/params.rs:26 (n−f = 4/5, 2f+1 = 2/5 for n = 5f+1); fast/mod.rs (why it is a separate keeper, not a mode)."
