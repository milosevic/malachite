change = "In code/crates/core-types/src/threshold.rs, rewrite `ThresholdParam::is_met` to perform the comparison in `u128`: `(weight as u128) * (self.denominator as u128) > (total as u128) * (self.numerator as u128)`, dropping both `checked_mul(...).expect(\"attempt to multiply with overflow\")` calls. Do the same in `ThresholdParam::min_expected`: compute `1 + ((total as u128 * self.numerator as u128) / self.denominator as u128)` and convert back with `u64::try_from(..).unwrap_or(u64::MAX)` (the result is <= total+1, so it always fits for any real total). Every u64 input pair is then representable, since u64::MAX * u64::MAX fits in u128. Update the existing unit test `threshold_param_is_met_overflow` in the `#[cfg(test)] mod tests` of the same file: it is a `#[should_panic(expected = \"attempt to multiply with overflow\")]` characterization of the old behavior and must become a plain assertion, e.g. `assert!(!ThresholdParam::TWO_F_PLUS_ONE.is_met(1, u64::MAX));` plus `assert!(ThresholdParam::TWO_F_PLUS_ONE.is_met(u64::MAX, u64::MAX));`. Then in code/crates/core-votekeeper/tests/vote_keeper.rs: remove `#[ignore]` from `tally_never_overflows_on_accumulated_weight` so it runs by default, and convert `apply_vote_panics_on_total_weight_overflow` (line ~483) from `#[should_panic]` into a positive test asserting the emitted `Output` (e.g. that three votes of weight 3_100_000_000_000_000_000 out of that total do reach the expected threshold). Also re-check `code/crates/core-votekeeper/src/count.rs` lines ~65-75 and `keeper.rs:423-435` — they only call `is_met`, so no change is needed there, but run the crate tests to confirm no other `should_panic` depends on the old abort."
