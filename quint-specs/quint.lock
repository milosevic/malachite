[components.equivocation-detection]
name = "Equivocation Detection"
description = "Collects evidence of validator misbehavior — conflicting votes in the vote keeper (capped at three pairs per validator) and conflicting proposals in the driver's proposal keeper (uncapped) — and hands both to the application as MisbehaviorEvidence in the single Finalize effect at the end of a height."
role = "cross-cutting"
rank = 6
paths = [
    "code/crates/core-votekeeper/src/evidence.rs",
    "code/crates/core-consensus/src/handle/finalize.rs",
]
tests = [
    "code/crates/core-votekeeper/tests/evidence.rs",
    "code/crates/core-driver/tests/it/evidence.rs",
    "code/crates/test/tests/it/equivocation.rs",
    "code/crates/core-consensus/tests/finalization_evidence.rs",
]
dependencies = [
    "vote-keeper",
    "driver",
    "consensus-orchestrator",
]
operations = [
    "EvidenceMap::add(existing, conflicting) — mutates; dedup-checked insert, debug_asserts the same validator",
    "EvidenceMap::get(address) / is_empty() / iter() — query (evidence.rs:29-71)",
    "ProposalKeeper::store_proposal(proposal, validity) — mutates; on ConflictingProposal records evidence (proposal_keeper.rs:236-254)",
    "ProposalKeeper::evidence() — query; take_evidence() — mutates (drains) (proposal_keeper.rs:226-233)",
    "VoteKeeper equivocation branch inside apply_vote — mutates; calls evidence.add (keeper.rs:270-281)",
    "Driver::take_proposal_evidence() / take_vote_evidence() — mutates; called only from finalize (finalize.rs:75-76)",
    "log_and_finalize -> Effect::Finalize(certificate, extensions, MisbehaviorEvidence{proposals, votes}) — mutates (finalize.rs:74-81)",
]
headlineProperties = [
    "An equivocating vote never contributes to a threshold output — it is absorbed into evidence instead",
    "Evidence for one conflicting pair is deduped in both orderings, so replaying the same equivocation does not grow the evidence set",
    "Evidence contains exactly two conflicting messages from one validator for one (height, round, type)",
    "Evidence accumulates for a whole height and is drained exactly once, at finalize — never surfaced mid-round",
]
adversarySurface = [
    "A validator sends two or more distinct valid proposals for one round — ConflictingProposal captured (proposal_keeper.rs:242-252)",
    "A validator sends two conflicting votes for one height/round — evidence.add (keeper.rs:274-279)",
    "A third and fourth equivocating message still yields one record per unique unordered pair, not per message",
    "Two proposals from *different* validators landing in the same PerRound is a panic, not an attacker-tolerated path (proposal_keeper.rs:108-118) — open question whether it is externally reachable",
    "Unbounded evidence growth from a validator equivocating in every round of a long height",
]
specHints = "Two EvidenceMap types exist: core-votekeeper/src/evidence.rs (DoubleVote, owned here) and core-driver/src/proposal_keeper.rs (DoubleProposal, whose file is hashed under `driver` to avoid double-counting drift). core-consensus/src/types.rs:146-155 defines MisbehaviorEvidence{proposals, votes}, the join point; core-consensus/src/handle/finalize.rs:74-81 is the single drain/emit site and is this component's only output operation. A separate accountability model exists at specs/consensus/accountable-tm/misbehavior.qnt + accTypes.qnt, unwired. The property spans vote-keeper, driver and orchestrator, so it grounds on none of them alone."
