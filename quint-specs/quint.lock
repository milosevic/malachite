    "Exact duplicate vote silently ignored, no re-tally (keeper.rs:107-109)",
    "Vote for a round above the current one can trigger SkipRound while not counting toward the current round's thresholds",
    "Zero-voting-power validator, and weight sums overflowing ThresholdParam::is_met's checked_mul (panics)",
    "prune_votes(min_round) discards emitted-output dedup state for pruned rounds, so a re-delivered old vote could re-emit an output",
]
