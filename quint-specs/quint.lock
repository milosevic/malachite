[[components.p2p-network.productIntent.goals]]
claim = "It should be possible to have a peer end up classified as a validator when its verified proof arrives before Identify completes."
expectations = [
    "`record_verified_proof` returns `None` and buffers the key instead of dropping it",
    "after Identify, `peerV.consensus_public_key` is `keyV` and `consensus_address` is set from the matching validator",
    "the score `update_peer` returns is the validator score, not the freshly-created full-node score",
]
headline = "Proof arriving before Identify still promotes"
id = "proof-arriving-before-identify-still-promotes"
quint = [
    "val proofBeforeIdentifyPromotes =",
    "  pendingProofs.has(p) and identifyDone(p) implies",
    "    peers.get(p).peerType == Validator",
]
recordedAt = 1788511457271
why = "Without the buffer, a validator that proves itself faster than Identify completes would silently stay a full node and lose its eviction immunity."

