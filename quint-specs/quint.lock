    "state_machine::apply(ctx, state, info, input) — mutates; the full (Step x Input) transition table",
    "State::update_round(round) — mutates (also clears scheduled_timeouts)",
    "State::with_round / with_step / set_locked / set_valid / set_decision — mutates (builders)",
