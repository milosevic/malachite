[[components.node-config.hardToReproduce]]
revision = 4
kind = "code"
problem = "The observation is `state.pubsub_max_size > TRANSPORT_MAX_SIZE` (quint-specs/node-config.qnt:883), with TRANSPORT_MAX_SIZE a spec-only constant of 16 (MiB) at node-config.qnt:139 that has NO counterpart anywhere in the code. Its action `P2pConfigset_message_limits` (node-config.qnt:522-529) is unguarded and installs any value; the comment states \"No bound is checked against the transport\". The code agrees: `P2pConfig.pubsub_max_size: ByteSize` (code/crates/config/src/lib.rs:158) is a bare serde field, the only P2P validation is `ChannelNames::validate` (lib.rs:80) called from `spawn_network_actor` (code/crates/app/src/spawn.rs:52-56), and `make_network_config` (spawn.rs:268) forwards the raw byte count to `gossipsub_config` → `ConfigBuilder::max_transmit_size` (code/crates/network/src/behaviour.rs:179-195), which accepts an arbitrarily large value; `build().unwrap()` does not fail. Nothing in the network crate enforces a 16 MiB frame cap either — the yamux config at code/crates/network/src/lib.rs:368 is `libp2p::yamux::Config::default` with no window/frame override, and the only `set_max_len` is the unrelated validator-proof codec (crates/network/src/validator_proof/codec.rs:53). So an oversized pubsub limit is accepted by every layer and no error API exists to assert a rejection against; the divergence would only show as a runtime transport failure when a message that large is actually published, which this component's boundary does not reach. To make it testable the code needs a real cap constant plus a validator, and the spec's action then needs the matching guard."
summary = "A pub-sub size limit larger than the transport can carry is accepted at every layer, so no test has a rejection to assert. Oversized messages fail only later, at send time, on a live connection."
trackNames = ["pubsub_limit_above_transport_capacity"]

