[[components.consensus-orchestrator.productIntent.hazards]]
claim = "It should be impossible to reach a state where a valid vote for the current height is discarded with no record and no way to recover it."
expectations = [
    "The vote is dropped before the dedupe, signature and WAL steps, so nothing about it survives",
    "Buffering only applies to votes for a *higher height*; a same-height far-future round is not buffered at all",
    "The only trace left is the `dropped_future_round_votes` counter under the `metrics` feature",
    "Nothing re-requests the vote, so a node lagging more than 20 rounds behind cannot catch up on the vote path",
]
headline = "Far-future-round votes are not lost forever"
id = "far-future-round-votes-are-not-lost-forever"
quint = [
    "val noSilentVoteLoss =",
    "  all { v.height == state.height, validSignature(v) }",
    "    implies (applied.contains(v) or buffered.contains(v))",
]
recordedAt = 1789041226213
why = "A node that falls more than the lookahead behind within a height can never rejoin that height through votes, and the drop is invisible without metrics enabled."

