[[systemAnalyses.consensus-orchestrator-wal.properties.properties]]
group = "system"
hypothesis = "expect-violated"
kind = "invariant"
name = "no_amnesia"
sentence = "A validator that crashes and restarts never contradicts a vote it published before the crash, because every vote is durably logged before it is sent. The WAL component's recorded hazards describe an append that is skipped while the actor is recovering and one dropped on a height mismatch with an Ok reply, so the expectation here is set against the statement."

