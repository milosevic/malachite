[components.fast-round-state-machine]
name = "Fast Tendermint Round State Machine"
description = "The separate n>5f per-round algorithm (Unstarted → Propose → Precommit → Commit) with one voting step, a merged valid:(round, id) field, id-only re-proposals and the WaitForValid proposer wait, as a pure apply(state, info, input) → Transition."
role = "central"
rank = 0
paths = [
    "code/crates/core-state-machine/src/fast/state_machine.rs",
    "code/crates/core-state-machine/src/fast/state.rs",
