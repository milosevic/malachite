    "evidence() — query",
    "take_evidence() — mutates (drains the evidence map)",
    "prune_votes(min_round) — mutates (drops rounds below min_round)",
    "PerRound::add(vote, weight) — mutates (dedupes by validator+type; returns ConflictingVote on equivocation)",
    "PerRound::get_vote / received_votes / precommits_for_value / addresses_weights / emitted_outputs — query",
]
headlineProperties = [
    "Each Output variant is emitted at most once per round (emitted_outputs set, keeper.rs:305-312)",
    "A validator's first vote of a given type/round is final; a later differing vote is recorded as equivocation, never re-tallied (keeper.rs:99-109)",
    "PolkaValue(v) implies strictly more than 2/3 of total voting power prevoted v in that round",
    "SkipRound(r) is computed only from the honest f+1 threshold over votes strictly above the current round (keeper.rs:292-301)",
    "PrecommitValue takes priority over SkipRound for future rounds (threshold_to_output, keeper.rs:378-384)",
]
