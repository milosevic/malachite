    "Every terminated pending connection must return its slot, not only those ending in `ConnectionClosed` or `ListenFailure`",
    "Once all connections from `ip1` are gone, `ip1.count` should be `0`",
]
headline = "Aborted Handshake Frees Its IP Slot"
id = "aborted-handshake-frees-its-ip-slot"
quint = [
    "val noLeakedSlots =",
    "  liveConns(ip1).size() == ip1.count",
    "val slotAlwaysReclaimed =",
    "  conns.filter(c => c.stage == Aborted)",
    "       .forall(c => not(limiter.tracked.contains(c)))",
]
recordedAt = 1788511395630
why = "The counter is decremented only on ConnectionClosed and ListenFailure, so any other pending-connection termination path would permanently consume a slot for that IP."

