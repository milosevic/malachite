[components.wal]
name = "Write-Ahead Log"
description = "The CRC-checked append-only log plus the engine WAL actor and thread that sequence entries per consensus height, replay them after a crash, and answer the consensus append/flush effects."
role = "peripheral"
rank = 7
paths = [
    "code/crates/wal/src/log.rs",
    "code/crates/wal/src/file.rs",
    "code/crates/wal/src/storage.rs",
    "code/crates/wal/src/ops.rs",
    "code/crates/wal/src/version.rs",
    "code/crates/wal/src/ext.rs",
    "code/crates/wal/src/lib.rs",
    "code/crates/engine/src/wal.rs",
    "code/crates/engine/src/wal/thread.rs",
    "code/crates/engine/src/wal/iter.rs",
    "code/crates/engine/src/wal/entry.rs",
]
tests = [
    "code/crates/wal/tests/it/basic.rs",
    "code/crates/wal/tests/it/compression.rs",
    "code/crates/wal/tests/it/corruption.rs",
    "code/crates/wal/tests/it/crashes.rs",
    "code/crates/wal/tests/it/stress.rs",
    "code/crates/wal/tests/it/truncation.rs",
    "code/crates/test/tests/it/wal.rs",
    "code/crates/test/tests/unit/wal_codec.rs",
]
dependencies = [
    "consensus-orchestrator",
    "engine-actors",
    "core-types-domain",
]
operations = [
    "Log::open / open_with(path, options) — constructor; validates and truncates a partial tail (log.rs:219-336)",
    "Log::append / write_raw / write_compressed(data) — mutates; truncates back to the pre-write position on any write error (log.rs:351-436)",
    "Log::first_entry() / iter() — query; NotFound when the file is empty (log.rs:444-470)",
    "Log::reset(sequence) — mutates; truncates all entries and sets a new sequence (log.rs:483-501)",
    "Log::truncate(from_entry) — mutates; no-op when from_entry is past the end (log.rs:515-565)",
    "Log::flush() — mutates (fsync) (log.rs:574)",
    "Log::from_raw_parts(...) — constructor; documented test-only bypass of validation (log.rs:586-600)",
    "Wal actor Msg::StartedHeight(height, reply) — guarded mutation; resets when the log sequence differs from the height, replays when equal (engine/src/wal.rs:87-99, thread.rs:76-98)",
    "Wal actor Msg::Reset(height, reply) — mutates (wal.rs:101-104)",
    "Wal actor Msg::Append(height, entry, reply) — guarded mutation; silently succeeds without writing when the height does not match (wal.rs:107-120)",
    "Wal actor Msg::Flush(reply) — mutates (wal.rs:122)",
    "Wal actor Msg::Dump — query (wal.rs:126, thread.rs:236-267)",
]
headlineProperties = [
    "Every entry read back matches its CRC; a mismatch is a hard error, never a silent skip (log.rs:96-98)",
    "An append that fails truncates back to the pre-append length, so append() never leaves a partial entry durable (log.rs:426-435)",
    "On open, a trailing partial or corrupt entry is truncated away and the rest of the log is accepted (log.rs:280-303)",
    "The WAL sequence number equals the consensus height: starting a new height resets the log, so a height's entries never mix with another's (thread.rs:79-97)",
    "Replaying all valid entries reproduces exactly the pre-crash published-vote set",
]
adversarySurface = [
    "Crash mid-write leaving a torn tail entry — truncated away at open (log.rs:264-303)",
    "CRC corruption of an interior (non-tail) entry — the engine thread truncates at the bad index and stops replay early, silently losing later undamaged entries (thread.rs:199-208)",
    "Oversized entry (>1 GiB) rejected as InvalidData (log.rs:66-71)",
    "Append for a height that no longer matches the actor's in-memory height is dropped with an Ok reply — a silent-loss race if StartHeight races an in-flight Append (wal.rs:107-120)",
    "A panic inside the WAL thread is caught and logged but orphans the channel, with no restart (thread.rs:37-56)",
    "Restart replaying a WAL written under a different validator set or software version",
]
specHints = "On-disk entry format (flag|length|CRC|data) in wal/src/log.rs; the concrete Log<File> in file.rs; storage.rs/ops.rs/version.rs/ext.rs are the no_std storage abstraction. WalEntry is one of {Vote, Proposal, PolkaCertificate, RoundCertificate} (engine/src/wal/entry.rs). The engine actor is folded in here deliberately: the orchestrator only ever sees Effect::WalAppend/WalReset (core-consensus/src/effect.rs) and never the Log type, so the actor protocol (Msg::StartedHeight/Append/Reset) is the real state-machine boundary to model. Callers: core-consensus/src/handle/vote.rs:95-102 and the equivalents in proposal.rs/propose.rs. No Quint spec exists yet; quint-specs/consensus-wal.qnt is an in-progress Studio spec."
cardRead = false
connectionsRead = false
spec = "quint-specs/wal.qnt"
version = 2
observationsConfirmed = true
propertiesConfirmed = true
