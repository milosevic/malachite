headlineProperties = [
    "Agreement at the round level: committing a second, different value after a decision yields Transition::invalid rather than overwriting (state_machine.rs:575-588)",
    "Step::Commit is terminal — any input in Commit yields Transition::invalid (state_machine.rs:214)",
    "Most transitions require input_round == state.round; only SkipRound (L55) and TimeoutPrecommit/PrecommitAny (L47/L65) accept other rounds (state_machine.rs:221-236)",
    "The locking rule holds: prevote() votes for the locked value or nil based on lock round vs POL round (state_machine.rs:336-413)",
    "A propose/prevote/precommit timeout is scheduled at most once per round (ScheduledTimeouts bitset, state.rs:36-75)",
