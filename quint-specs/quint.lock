    "ByzantineConfig::validate() — guarded query; rejects contradictory drop+equivocate combinations and invalid trigger parameters (config.rs:135-159)",
    "Trigger::fires(height, round, rng) — query; deterministic or probabilistic (config.rs:307)",
    "ByzantineNetworkProxy::spawn(config, real_network, signer, ctx, address, ...) — constructor; validates then spawns a drop-in NetworkRef (proxy.rs:102)",
    "handle_consensus_msg(Vote | Proposal) — mutates; drops, equivocates or forwards, caching the VoteAction per (height, round, vote_type) (proxy.rs:218-310)",
    "handle_liveness_msg(...) — mutates; replays the cached VoteAction or evaluates the trigger fresh (proxy.rs:318)",
    "Subscribe(inner) — mutates; splices in the InboundFilter when drop_inbound_proposals is set (proxy.rs:176)",
    "InboundFilter::handle(...) — mutates; drops NetworkEvent::Proposal per trigger, else forwards (inbound.rs:85)",
    "Amnesia::record_proposed_value(height, round, value_id) — mutates (amnesia.rs:80)",
    "Amnesia::try_override_nil_prevote(height, round) — guarded mutation; consumes the cached value only on an exact (height, round) match (amnesia.rs:94-121)",
    "ByzantineMiddleware::new_precommit(...) — mutates; rewrites the node's own non-nil precommit to nil when force_precommit_nil fires (test/src/byzantine.rs:160)",
]
headlineProperties = [
    "validate() rejects contradictory configurations before the actor is spawned (config.rs:145-156)",
    "A vote's byzantine action is decided once on the consensus path and replayed on the liveness path, so the two never disagree (proxy.rs:87-91)",
    "Amnesia overrides fire only for the exact (height, round) recorded, otherwise it is a no-op (amnesia.rs:106-121)",
    "Injected misbehavior is confined to the configured validator, never to the rest of the network",
]
adversarySurface = [
