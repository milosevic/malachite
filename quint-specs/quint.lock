[[components.consensus-orchestrator.productIntent.hazards]]
claim = "It should be impossible to reach a state where handling an input aborts the node instead of returning an error."
expectations = [
    "`on_timeout_elapsed` gates `FinalizeHeight` on `step_is_commit()` only, which is still true after finalizing",
    "`finalize_height` then hits `assert!(state.finalization_period)` and panics",
    "The two guards disagree: `decide` sets `finalization_period` as the real latch, but the timeout branch does not consult it",
]
headline = "Second FinalizeHeight timeout is a no-op"
id = "second-finalizeheight-timeout-is-a-no-op"
quint = [
    "val noAbortOnInput =",
    "  handle(state, TimeoutElapsed(FinalizeHeight(r)))",
    "    != Aborted",
]
recordedAt = 1789041239650
why = "A duplicate or late finalize timeout takes the whole validator process down rather than being ignored as a stale timeout."

