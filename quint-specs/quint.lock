    "Re-proposal whose pol_round justification is older than our valid round (L28 acceptance rule)",
    "TimeoutPrecommit delivered after a decision — guarded by state.decision.is_none()",
    "WaitForValidExpired racing with the vote quorum that would have resolved the wait",
    "check_timeout called with TimeoutKind::Prevote, which this protocol has no step for (silently returns false)",
]
