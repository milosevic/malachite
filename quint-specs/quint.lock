[[components.node-config.hardToReproduce.options]]
title = "Validate the P2P size limits at config load"
gist = "Add a check that rejects a pub-sub or RPC size limit too small to carry a proposal, and run it when the network starts, so a test can assert the rejection."
change = "Add `P2pConfig::validate(&self) -> Result<(), P2pConfigError>` in code/crates/config/src/lib.rs next to `ChannelNames::validate` (lib.rs:80), with a `P2pConfigError` enum modeled on `ChannelNamesError` carrying a `PubsubMaxSizeTooSmall { configured, minimum }` variant (minimum 1 MiB) and the same for rpc_max_size; call it from `spawn_network_actor` (code/crates/app/src/spawn.rs:52) right after `channel_names.validate()`. Then the model's `P2pConfigset_message_limits` (quint-specs/node-config.qnt:522) gains the guard `pubsub_max_size >= MIN_PROPOSAL_SIZE and rpc_max_size >= MIN_PROPOSAL_SIZE` and a reject branch to mirror it."
