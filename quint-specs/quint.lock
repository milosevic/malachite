[[components.vote-keeper.productIntent.goals]]
claim = "It should be possible to receive `PrecommitValue(v)` for a round ahead of the current one, even though the f+1 skip threshold for that round is already met."
decidedAt = 1788006458570
decision = "confirmed"
expectations = [
    "`threshold_to_output` special-cases `(Precommit, Threshold::Value)` inside the future-round branch",
    "`SkipRound(Round(1))` is not re-emitted, because it is already in `emitted_outputs`",
    "the same vote would have produced `PrecommitAny` had the quorum been split across values",
    "the driver can commit at `Round(1)` without first stepping through the skip",
]
headline = "PrecommitValue outranks SkipRound in a future round"
id = "precommitvalue-outranks-skipround-in-a-future-round"
quint = [
    "run futurePrecommitValue =",
    "  init.then(applyPrecommit(v1, Round(1), X))",
    "      .then(applyPrecommit(v2, Round(1), X))",
    "      .then(applyPrecommit(v3, Round(1), X))",
    "      .expect(output == Some(PrecommitValue(X)))",
]
why = "Learning a commit quorum for a future round is what lets a lagging node decide instead of only skipping forward."

