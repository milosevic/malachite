    "code/crates/core-state-machine/src/fast/output.rs",
    "code/crates/core-state-machine/src/fast/mod.rs",
]
tests = ["code/crates/core-state-machine/tests/fast_round.rs"]
dependencies = [
    "core-types-domain",
    "fast-vote-keeper",
]
operations = [
    "fast::state_machine::apply(state, info, input) -> Transition — mutates (returns next state)",
    "Transition::to / ::invalid / ::with_output — constructors",
    "Info::new(input_round, address, proposer) / Info::new_proposer — query",
    "Info::is_proposer() — query",
    "State::new(height, round) — constructor",
    "State::valid_round() — query (Round::Nil when nothing valid)",
    "State::valid_is(value_id) — query",
    "State::with_step(step) — mutates",
    "State::update_round(round) — mutates (clears scheduled timeouts, keeps valid/decision)",
    "State::set_valid(round, value_id) — mutates (monotone: no-op unless round > valid_round)",
    "State::set_decision(proposal_round, value) — mutates",
    "State::check_timeout(kind) — mutates (returns false on repeat, and for Prevote/Rebroadcast/FinalizeHeight)",
    "ScheduledTimeouts::check(kind) — mutates; ScheduledTimeouts::clear() — mutates",
    "Output::vote(ctx, height, round, value_id, address) — always a precommit — query",
    "Output::schedule_timeout(round, kind) — query",
]
headlineProperties = [
    "valid_p only ever increases: set_valid is a no-op unless the new round is strictly above the recorded valid round",
    "At most one decision per height; once step is Commit, ProposalAndDecisionQuorum no longer transitions",
    "Each per-round timeout (Propose, Precommit) is scheduled at most once per round, and the bitset is cleared exactly on a round change",
    "There is no unlock and no SkipRound: a round advances only via QuorumAny(round >= state.round) or NewRound",
    "A re-proposal is emitted as Repropose{value_id, valid_round} only when valid is set; the state machine never invents a value it does not hold",
    "Prevote-shaped inputs/outputs do not exist: every vote output is a precommit",
]
adversarySurface = [
