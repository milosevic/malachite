[[components.node-config.hardToReproduce]]
revision = 4
kind = "code"
problem = "The observation is `state.pubsub_max_size < MIN_PROPOSAL_SIZE` (quint-specs/node-config.qnt:880). Its spec action `P2pConfigset_message_limits` (node-config.qnt:522-529) is UNGUARDED: it installs whatever pubsub_max_size/rpc_max_size the TOML says and the comment says so explicitly (\"No bound is checked against the transport\"). The real code matches exactly: `P2pConfig.pubsub_max_size: ByteSize` (code/crates/config/src/lib.rs:158) is a plain serde field with no validator; the only validation on the P2P config path is `ChannelNames::validate` (lib.rs:80), called from `spawn_network_actor` (code/crates/app/src/spawn.rs:52-56), and it never looks at the size limits. Downstream, `make_network_config` (spawn.rs:268) just does `cfg.p2p.pubsub_max_size.as_u64() as usize` and `gossipsub_config` (code/crates/network/src/behaviour.rs:179-195) passes it to `ConfigBuilder::max_transmit_size`, which accepts 0 — `build().unwrap()` does not fail. So there is NO reject branch and no error API anywhere: `toml::from_str::<P2pConfig>` with `pubsub_max_size = \"0 B\"` returns Ok, and the node starts. A contract-assertion test could only assert a rejection that neither the spec's guard nor the code implements — the spec is faithful to the code here, so this is not a code-vs-model divergence but a missing-validation design gap. Making it testable requires adding a validator (e.g. a `P2pConfig::validate` returning a new error enum next to `ChannelNamesError`, invoked from `spawn_network_actor` alongside `channel_names.validate()`), and then the spec's `P2pConfigset_message_limits` needs the matching guard so the observation becomes a reject rather than an accepted state."
summary = "A pub-sub size limit too small to carry a proposal is silently accepted: nothing validates it, so a test has no rejection to assert. The node starts and quietly cannot deliver consensus values."
trackNames = ["pubsub_limit_below_proposal_size"]

