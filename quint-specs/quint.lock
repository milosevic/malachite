[[components.wal.productIntent.hazards]]
claim = "It should be impossible to reach a state where one entry the codec cannot decode makes the node hang on every subsequent restart with no way to progress."
expectations = [
    "`fetch_entries` truncates the log only on an `Err` from the iterator (CRC/IO), never on a decode failure from `decode_result`",
    "a decode failure is pushed as `Err` into the replay vector and iteration continues to later entries",
    "`wal_replay` routes any `Err` entry to `hang_on_safety_failure`, so `node.state` becomes a hang, and `wal.len` is unchanged across restarts",
]
headline = "Undecodable entry doesn't wedge every restart"
id = "undecodable-entry-doesn-t-wedge-every-restart"
quint = [
    "val undecodableIsRecoverable =",
    "  wal.entries.select(e => e.codec != Current).size() > 0",
    "    implies eventually(node.state == Running)",
    "// violated: decode Err hangs, entry stays on disk",
]
recordedAt = 1788516713874
why = "A single entry written by a previous software version turns a crash into permanent downtime for that validator, with no operator path short of hand-editing the WAL file."

