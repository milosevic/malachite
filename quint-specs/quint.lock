    "Height::increment / increment_by / decrement / decrement_by — query; decrement_by returns None below the minimum (height.rs:21-35)",
    "Timeouts::duration_for(timeout) — query; documented to panic when timeout.round is Nil (timeouts.rs:27-30)",
    "Round::as_i64 / is_nil / is_defined / increment — query (round.rs)",
    "Context::select_proposer(validator_set, height, round) — query; the deterministic proposer-selection contract (context.rs:47)",
    "SignedMessage::new / verify — constructor / query (signed_message.rs)",
]
headlineProperties = [
    "Quorum uses a strict greater-than against numerator/denominator, never greater-or-equal: 2f+1 means strictly more than 2/3 of total power (threshold.rs:77)",
    "Validator set ordering is deterministic (voting power descending, then address ascending) — documented but not enforced by the trait (validator_set.rs:37-42)",
    "select_proposer is a pure function of (validator_set, height, round), so all correct nodes agree on the proposer",
    "Certificate constructors keep only votes matching the certificate's own height/round/value/type",
    "CertificateError enumerates every verification failure: InvalidCommit/Polka/RoundSignature, UnknownValidator, NotEnoughVotingPower, DuplicateVote, InvalidVoteType, VerificationError (certificate.rs:141-183)",
]
adversarySurface = [
