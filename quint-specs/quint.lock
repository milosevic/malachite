problem = """
The violation is REAL and reproduced with a failing test, but as with the other violation entries in this batch, no lane here can record it.

Replayed seed 1788010541238250000: VIOLATED. `tally_never_overflows` (quint-specs/vote-keeper.qnt:576-583) requires every tallied weight, and `3 * sumWeights`, to stay within MAX_WEIGHT (1000000 in the model, standing in for u64::MAX in the code).

The code aborts the process instead. `ThresholdParam::is_met` (code/crates/core-types/src/threshold.rs:68-78) computes `weight.checked_mul(self.denominator).expect(\"attempt to multiply with overflow\")` and `total.checked_mul(self.numerator).expect(...)`. With the default TWO_F_PLUS_ONE quorum (denominator 3, numerator 2), a validator whose voting power exceeds u64::MAX/3 makes the LHS overflow even when `total * 2` fits comfortably — so the abort comes from the ACCUMULATED TALLY, exactly what the property names, not merely from an oversized validator set total. `VoteKeeper::new` (code/crates/core-votekeeper/src/keeper.rs:198) accepts such a validator set with no validation, and the first well-formed vote reaches `compute_threshold` -> `is_met` and panics.

Test written through the public API only (`VoteKeeper::new` + `apply_vote`, default `ThresholdParams`): `tally_never_overflows_on_accumulated_weight` in code/crates/core-votekeeper/tests/vote_keeper.rs, declaration `fn tally_never_overflows_on_accumulated_weight() {`, validator set [6_500_000_000_000_000_000, 2_500_000_000_000_000_000] so `total * 2` fits in u64 while `big * 3` does not. It FAILS with `panicked at crates/core-types/src/threshold.rs:71:14: attempt to multiply with overflow`. Committed marked `#[ignore]`; run with `cargo test --manifest-path code/Cargo.toml -p arc-malachitebft-core-votekeeper --test vote_keeper tally_never_overflows_on_accumulated_weight -- --ignored`.

This strictly extends the existing `#[should_panic]` characterization test `apply_vote_panics_on_total_weight_overflow` (code/crates/core-votekeeper/tests/vote_keeper.rs:483), which only covers the total-weight case.

Recording blocker: `record_tests` requires an exact family match and the oracle discards a FAILING test's trace (\"test ended: ... failed — discarding its trace\"); `record_reproduction` is refused with \"no active reproduction batch\". Neither lane accepts this test."""
