    "core-types-domain",
]
operations = [
    "State::new(ctx, height, validator_set, params, queue_cap, per_height_cap) — constructor (state.rs:60)",
    "handle(co, state, metrics, input) — mutates; the single entry point dispatching to handle/* (handle.rs:27)",
    "reset_and_start_height(...) — mutates: cancels timeouts, resets state, starts round 0, replays buffered inputs unless restarting (start_height.rs:6-92)",
    "on_vote(co, state, metrics, vote) — guarded mutation: drops past heights, buffers future ones, dedupes, verifies signature and extension, WAL-appends, applies to driver (vote.rs:8-107)",
    "on_proposal(...) — guarded mutation, same shape for proposals (proposal.rs)",
    "on_propose(...) — mutates (locally produced proposal, propose.rs)",
    "on_proposed_value(...) — mutates (application-supplied value, proposed_value.rs)",
    "on_timeout_elapsed(...) — mutates (timeout.rs)",
    "on_value_response(...) / maybe_sync_decision(...) — mutates (sync.rs)",
    "on_polka_certificate(...) / on_round_certificate(...) — mutates (liveness.rs)",
    "decide(co, state, metrics) — mutates: builds/verifies the commit certificate, emits Effect::Decide, enters the finalization period (decide.rs:7-114)",
    "finalize_height(...) — mutates: drains evidence, emits Effect::Finalize, clears the finalization period (finalize.rs:74-81)",
    "State::store_proposal / store_value — mutates (FullProposalKeeper, state.rs:188-221)",
    "State::buffer_input / take_pending_inputs — mutates (bounded queue, state.rs:245-272)",
    "State::is_active_validator() / round_certificate() / polka_certificate() / decided_value() — query",
]
headlineProperties = [
    "Inputs for a past height are dropped and never buffered; inputs for a future height (or with consensus_round Nil) are buffered and replayed only on a non-restart start_height (vote.rs:24-36, start_height.rs:69-92)",
    "An already-seen vote is a no-op, which is what prevents a double WAL append (vote.rs:77-79)",
    "The finalization period is entered exactly once per height by decide() and left exactly once by finalize_height()",
    "decide() runs only when the driver is in Commit, and every published vote/proposal is WAL-appended before it is published",
    "A SyncDecision is accepted only when the corresponding commit certificate is already stored",
]
