[systemAnalyses.consensus-orchestrator-wal.seed]
question = "Does 'Surviving a crash' uphold its recorded guarantees?"

[systemAnalyses.consensus-orchestrator-wal.seed.interaction]
name = "Surviving a crash"
shape = "two-party"

[[systemAnalyses.consensus-orchestrator-wal.seed.interaction.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "wal"
requirement = "Effect::WalAppend has durably committed the entry before the corresponding message is published — an Append that is silently dropped because the actor's height moved on would break the no-amnesia property."
status = "unchecked"

[[systemAnalyses.consensus-orchestrator-wal.seed.interaction.bridgeChecks]]
assumer = "wal"
provider = "consensus-orchestrator"
requirement = "The orchestrator issues StartedHeight before any Append for that height, so the log's sequence number always matches the height being appended to."
status = "unchecked"

[[systemAnalyses.consensus-orchestrator-wal.seed.interaction.groupProperties]]
name = "No amnesia"
statement = "A validator that crashes and restarts never contradicts a vote it published before the crash, because every vote is durably logged before it is sent."

[[systemAnalyses.consensus-orchestrator-wal.seed.interaction.groupProperties]]
name = "Replay fidelity"
statement = "Replaying the WAL for a height reproduces exactly the votes and proposals the node had already published at that height — no more and no fewer."

[[systemAnalyses.consensus-orchestrator-wal.seed.interaction.groupProperties]]
name = "Height isolation"
statement = "Entries from a previous height are never replayed into a later one."

[[systemAnalyses.consensus-orchestrator-wal.seed.interaction.roleGroups]]
cardinality = 1
componentKey = "consensus-orchestrator"
role = "consensus"

[[systemAnalyses.consensus-orchestrator-wal.seed.interaction.roleGroups]]
cardinality = 1
componentKey = "wal"
role = "log"

[[systemAnalyses.consensus-orchestrator-wal.seed.span]]
componentKey = "consensus-orchestrator"
specPath = "quint-specs/consensus-orchestrator.qnt"

[[systemAnalyses.consensus-orchestrator-wal.seed.span]]
componentKey = "wal"
specPath = "quint-specs/wal.qnt"

[systemAnalyses.consensus-orchestrator-wal.properties]
format = "quint-system-properties"
key = "consensus-orchestrator-wal"
notes = [
    "The three seeded guarantees (no_amnesia, replay_fidelity, height_isolation) are proposed with the hypothesis expect-hold because each recorded statement asserts the guarantee; the question is exactly whether the composition upholds them.",
    "Each system and wiring guarantee is paired with a scenario witness, listed as its own row with kind witness: crash_after_publish_reached for no_amnesia, replay_after_restart_reached for replay_fidelity, second_height_started_reached for height_isolation, restart_with_stale_log_reached for restart_does_not_resurrect_stale_votes, append_then_publish_reached for wal_append_durable_before_publish, append_at_height_reached for started_height_precedes_appends, orchestrator_append_recorded_reached for orchestrator_wal_ledger_matches_log. A guarantee reported as holding means nothing unless its witness was reached.",
    "Both bridge checks are proposed as expect-violated: the write-ahead log spec's Msg::Append drops the entry and answers Ok when the height does not match the actor's height, and consensus_wal_append_and_broadcast broadcasts the message whatever the append reply was. For started_height_precedes_appends, StartHeight and the vote path are independent inputs in the orchestrator spec, so an append can precede the StartedHeight for its height.",
    "Added beyond the seeds: restart_does_not_resurrect_stale_votes (the orchestrator's recorded adversary surface names a restart with a stale log replaying votes for a height the node has already moved past, and the log actor's StartedHeight returns early without touching the log sequence when it is already at that height) and orchestrator_wal_ledger_matches_log (the orchestrator counts every append optimistically in walEntries and walAppends, while the log may silently drop or later truncate it).",
    "Every seeded item is proposed; none was dropped. All are judged testable in the composed spec.",
    "Five write-ahead log invariants are recorded as violated at component level because the spec carries a confirmed observation that is the exact negation of each: oversized_entry_written for no_unreadable_durable_entry, open_dropped_intact_entries for open_keeps_intact_entries, replay_discarded_later_intact_entries for replay_keeps_later_intact_entries, broadcast_without_durable_entry for no_broadcast_without_durable_entry, entries_span_multiple_heights for entries_belong_to_the_logs_height. The last two are the component-level counterparts of the no_amnesia and height_isolation system rows. The remaining component rows are measured as a baseline under the analysis bounds.",
    "quint-specs/consensus-orchestrator.qnt required a behaviour-preserving Core module split (new module consensusOrchestratorCore holding the types, constants and pure transitions; consensus_orchestrator keeps var s, the actions, the observations and the properties under their existing names) so the composed spec can import its logic instead of restating it. The span hash above is the post-split hash, so Studio will mark the Consensus Orchestrator's own results stale even though behaviour is identical; the equivalence check (typecheck plus a fixed-seed run over all 23 observations) is the first step of the analysis stage and is reported under assumptions.retrofits. A pre-split copy is kept in the session scratchpad.",
]
originGroup = "Surviving a crash"
question = "Does 'Surviving a crash' uphold its recorded guarantees?"
shape = "composition"
version = 1

