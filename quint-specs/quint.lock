    "spawn_network_actor(cfg, identity, registry, codec) — mutates (app/src/spawn.rs:56, app-channel/src/spawn.rs:31)",
    "start_engine(ctx, cfg, wal_ctx, network_ctx, consensus_ctx, sync_ctx, request_ctx) — mutates; builds the whole channel-based engine (app-channel/src/run.rs:74)",
    "ConsensusRequest::dump_state(tx) — guarded query; Option<StateDump> or ConsensusRequestError (msgs.rs:111)",
