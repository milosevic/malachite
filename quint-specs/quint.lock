[components.consensus-orchestrator]
name = "Consensus Orchestrator"
description = "The handler layer above the driver: routes every consensus input by height, buffers future-height inputs in a bounded queue and replays them on a non-restart start, admits votes only after dedupe/validator/signature checks and a WAL append, and runs the decide → finalization-period → finalize latch (including the sync-decision shortcut)."
