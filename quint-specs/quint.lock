    "debug_assert!(info.is_proposer()) on ProposeValue trusts the caller not to propose when not proposer (state_machine.rs:113)",
    "check_timeout for an untracked kind (Rebroadcast/FinalizeHeight) hits debug_assert!(false) in debug builds and silently returns false in release (state.rs:57-62)",
    "A second, different decided value after Commit — the safety case the transition table must reject",
]
specHints = "state_machine.rs:71 apply() is the single transition function; each match arm at :82 maps to a line of the Tendermint paper (input.rs names the L-lines). state.rs:99 State holds step, locked, valid, decision, scheduled_timeouts. transition.rs is the Transition{next_state, output} wrapper. traces/ is debug-only observation behind the `debug` feature with no behavioral effect. Existing spec: specs/consensus/quint/consensus.qnt (ConsensusState/consensus() mirrors apply()), already replayed by the consensus MBT runner."
