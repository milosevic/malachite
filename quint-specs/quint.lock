[[components.wal.productIntent.hazards]]
claim = "It should be impossible to reach a state where a height is restarted with entries on disk for that very height and the actor reports nothing to replay."
expectations = [
    "`Msg::StartedHeight` returns `Ok(Vec::new())` without forwarding to the WAL thread whenever `state.height == height`",
    "the thread's own guard would have replayed both entries, since `sequence == log.sequence()` calls `fetch_entries`",
    "the log is not reset either, so `wal.len` stays `2` while the driver restarts at `driver.votesKnown == 0`",
]
headline = "Restarting the same height still replays it"
id = "restarting-the-same-height-still-replays-it"
quint = [
    "val restartReplaysOwnHeight =",
    "  (walActor.height == wal.log.sequence and wal.len > 0)",
    "    implies replay.entries.length() == wal.len",
    "// violated by the actor-level early return for the same height",
]
recordedAt = 1788516747409
why = "A validator restarting a height it already voted in would forget its own persisted votes and could sign a conflicting one, which is exactly what the WAL exists to prevent."

