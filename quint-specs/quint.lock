[components.proposal-streaming]
name = "Proposal Streaming"
description = "Reassembles a proposal streamed as INIT / DATA* / FIN parts into a complete value, buffering out-of-order delivery until the stream is provably complete."
role = "peripheral"
rank = 8
paths = [
    "code/crates/engine/src/util/streaming.rs",
    "code/crates/app/src/part_store.rs",
    "code/crates/test/streaming/src/lib.rs",
    "code/crates/test/app/src/streaming.rs",
]
tests = [
    "code/crates/test/tests/it/n3f0.rs",
    "code/crates/test/tests/it/full_nodes.rs",
]
dependencies = [
    "core-types-domain",
    "message-codec",
]
operations = [
    "StreamMessage::new(stream_id, sequence, content) — constructor (engine/src/util/streaming.rs:48)",
    "StreamMessage::is_first() / is_fin() — query (streaming.rs:56-60)",
    "StreamContent::as_data() / into_data() / is_fin() — query (streaming.rs:79-93)",
    "PartStreamsMap::new() — constructor (test/streaming/src/lib.rs:124)",
    "PartStreamsMap::insert(peer_id, msg) — mutates; buffers the part and returns the assembled ProposalParts once the stream is complete (test/streaming/src/lib.rs:128)",
    "StreamState::insert(msg) — mutates; latches init_info on the first part, fin_received and total_messages on FIN, returns Some once done (test/streaming/src/lib.rs:71-95)",
    "StreamState::is_done() — query; requires init seen, FIN seen, and buffer length equal to total_messages (test/streaming/src/lib.rs:68)",
    "ProposalParts::init() / fin() — query (test/streaming/src/lib.rs:109-115)",
    "PartStore::store / all_parts / blocks_stored / prune — mutates/query (app/src/part_store.rs)",
]
headlineProperties = [
    "Parts are emitted in sequence order despite out-of-order receipt (min-heap on sequence)",
    "FIN fixes the total message count; nothing is emitted before INIT and FIN have both arrived and every sequence in between is buffered",
    "Each sequence number contributes at most once (seen_sequences set)",
    "A completed stream yields exactly one ProposalParts and takes its init_info, so it cannot complete twice",
]
adversarySurface = [
    "Duplicate sequence numbers from a peer — must not inflate buffer.len() past total_messages and complete the stream early",
    "FIN with a sequence lower than parts already buffered, giving total_messages below the buffered count so is_done() can never hold (a stuck stream / memory leak)",
    "Two FIN messages, or a DATA part after FIN",
    "A stream that never sends INIT or never sends FIN — unbounded buffering per peer",
    "Two peers streaming the same stream_id with different contents",
    "Sequence numbers near the Sequence type's maximum",
]
specHints = "engine/src/util/streaming.rs holds the wire framing types (StreamId, Sequence, StreamMessage, StreamContent::{Data,Fin}); the reassembly state machine to model is test/streaming/src/lib.rs:58-150 (StreamState with buffer: MinHeap, init_info, seen_sequences, total_messages, fin_received; is_done at :68, insert at :71). app/src/part_store.rs is the per-height store of assembled parts. An existing Quint model already mirrors this at specs/block-streaming/part_stream.qnt with specs/block-streaming/binary_heap.qnt, but no Rust replay harness is wired."
