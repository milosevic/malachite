hypothesis = "expect-violated"
kind = "invariant"
name = "replay_fidelity"
sentence = "Replaying the WAL for a height reproduces exactly the votes and proposals the node had already published at that height — no more and no fewer. The WAL component's recorded hazards describe a replay that stops at the first unreadable entry and a restart at an unchanged height that returns nothing, so the expectation here is set against the statement."

[[systemAnalyses.consensus-orchestrator-wal.properties.properties]]
