    "VoteKeeper::new(validator_set, threshold_params) — constructor",
    "apply_vote(vote, current_round) — mutates (tallies, may emit one Output, may record equivocation evidence)",
    "is_threshold_met(round, vote_type, threshold) — query",
    "has_vote(vote) — query",
