[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "The node starts height 1 (`Input::StartHeight`, start_height.rs) and proposes a value, which makes it prevote for value 1 (handle/propose.rs, then the prevote path in handle/vote.rs:95-102 that issues `Effect::WalAppend`). The append reaches the log actor while the actor's in-memory height is still 0, so `Msg::Append` (wal.rs:107-120) takes its height-mismatch branch: it drops the entry and answers `Ok(())`. Back at consensus.rs:1141-1167 the reply is only logged, `perform!` resumes, and the prevote for value 1 goes on the wire. The process then dies. On restart the node starts height 1 again; `reset_and_start_height` clears `publishedVotes`, and the log has nothing to replay, so nothing tells the node it already voted. It proposes again and prevotes for value 2 — the same height and round as before, a different value. The node has contradicted a vote its peers already have."
property = "no_amnesia"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "The log is opened, reset to sequence 1 (`Log::reset`, log.rs:483-501) and the actor is put at height 1 (`Msg::Reset`, wal.rs:101-104), so this time the prevote's append really is written to the log. The entry's CRC then stops matching. When `Msg::StartedHeight(1)` runs (wal.rs:87-99, thread.rs:76-98) the sequence matches, so the thread replays — but `read_to_next` (log.rs:66-98) fails on the damaged entry, the scan stops there and truncates. The replay hands back no votes at all, while the prevote it should have reproduced is already on the network. The recovered set and the published set differ, which is exactly the 'no more and no fewer' the guarantee claims."
property = "replay_fidelity"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "The log is opened fresh, so its sequence number is 0. The actor is separately put at height 1 by `Msg::Reset` (wal.rs:101-104), which sets the actor's in-memory height and leaves the log's own sequence untouched. The orchestrator starts height 1 and prevotes; because the actor's height now matches, the entry is written — and `write_entry` stamps it with the actor's height, 1, into a log still sequenced 0. When `Msg::StartedHeight(0)` arrives, the sequence matches 0, so the thread replays, and the height-1 vote is handed back as if it belonged to height 0. This is the same divergence the log's own `entries_belong_to_the_logs_height` invariant fails on."
property = "height_isolation"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "The orchestrator starts height 1 and prevotes, issuing `Effect::WalAppend` from handle/vote.rs:95-102. The log actor is still at height 0, so `Msg::Append` drops the entry and answers `Ok(())` (wal.rs:107-120). No entry exists, nothing was fsynced, and yet consensus.rs:1141-1167 resumes and broadcasts the prevote — the append result is only written to the log output. The requirement that the entry be durably committed before the message is published does not hold; nothing in either component enforces an ordering between the fsync and the send."
property = "wal_append_durable_before_publish"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "In the same two steps, the append for height 1 reaches the log actor before any `Msg::StartedHeight(1)` has been issued for it. The orchestrator's `Input::StartHeight` and its vote path are independent inputs — `reset_and_start_height` (start_height.rs:6-92) does not gate the vote path on the actor having acknowledged the height — so the append arrives first. Because the actor is still at its previous height, the entry is dropped rather than written; the log's sequence number therefore cannot match the height being appended to, which is the condition the requirement asserts."
property = "started_height_precedes_appends"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "The orchestrator's own bookkeeping counts every `Effect::WalAppend` as done: `walEntries` and `walAppends` grow when the prevote is emitted, and `published_votes_are_wal_logged` is satisfied against that record. But the entry the count refers to was dropped by the log actor. After these two steps the orchestrator believes one entry is logged for height 1 while the log holds none. Anything that later reasons from the orchestrator's ledger — including its own no-double-append invariant — is reasoning about a record the log does not share."
property = "orchestrator_wal_ledger_matches_log"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "A vote for height 1 arrives while the driver is still in the Nil round — the state the node is in before `NewRound`, which is also where it sits immediately after `State::new`. In `on_vote` (vote.rs:24-36) the branch order is: drop a past height, then buffer if the height is ahead **or** the consensus round is Nil. The vote's height equals the node's current height, so the first test does not fire, but the Nil-round test does, and `buffer_input` (state.rs:245) stores it under height 1 — the height the node is already on. The queue is documented and checked as holding only future heights; here it holds the current one, so the input is not a future input, and the replay on the next `StartHeight` will not pick it up either, because that reset keeps only heights strictly above the one starting. This is a component-level result: it reproduces on the orchestrator spec alone under the same bounds."
property = "buffered_inputs_are_future"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "The node starts height 1, proposes, and prevotes — appending the entry for (prevote, height 1, round 0, our address, value 1). It then starts height 1 again, which is what a restart at the same height does. `reset_and_start_height` clears `publishedVotes` but leaves the append ledger alone, so the node no longer knows it published that prevote while still counting the earlier append. It proposes again and prevotes for the same value, and `Effect::WalAppend` is issued a second time for a byte-identical entry. The append count reaches 2 while the set of distinct entries stays at 1. The orchestrator's headline claim that an already-seen vote is the no-op preventing a double append does not cover its own re-published vote after a restart, because the dedupe is against `prevotes` and `publishedVotes`, both of which the restart cleared. This is a component-level result: it reproduces on the orchestrator spec alone under the same bounds."
property = "wal_appends_are_not_duplicated"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "`Msg::Append` is sent for height 2 while the actor's in-memory height is 0 (wal.rs:107-120). The actor takes the mismatch branch: it does not hand the entry to the thread at all, and replies `Ok(())` to the caller. The recorded append then shows a successful reply with the log's length unchanged before and after. The caller cannot distinguish this from a real write, which is precisely how the dropped entry becomes invisible to the orchestrator and, downstream, to the no-amnesia guarantee. This is a component-level result: it reproduces on the log spec alone under the same bounds."
property = "append_ack_is_honest"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "`write_entry` (log.rs:392) applies no size check — the 1 GiB `MAX_ENTRY_SIZE` limit is enforced only on the read side, in `read_to_next` (log.rs:66-71). Appending one entry a single byte over the limit therefore succeeds and the entry becomes durable. Every later read of that entry reports a hard error, so the entry is permanently unrecoverable, and because the replay scan stops at the first unreadable entry, everything written after it is unreachable too."
property = "no_unreadable_durable_entry"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "One good entry is written, with a valid CRC and a length field that frames its bytes. The log is then re-opened. `Log::open` (log.rs:219-336) scans entries by their LENGTH field only and calls `truncate_to(pos)` from the first entry it cannot scan onward — it checks no CRC and it accepts a shorter prefix than the entries actually present. Here the scan settles on a zero-length prefix and truncates the good entry away. An entry whose CRC was still perfectly valid is deleted by the act of opening the file, so a restart can lose durable data without any corruption having occurred."
property = "open_keeps_intact_entries"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "`Effect::WalAppend` is resumed at consensus.rs:1141-1167 with no append having been recorded at all. The call site inspects the append result only to log it; `perform!` then resumes and the message is broadcast. One step is enough to put a consensus message on the network with no entry behind it. This is the component-level form of the same gap that breaks no_amnesia: the broadcast is not sequenced after the durability, so no restart can reconstruct what was said."
property = "no_broadcast_without_durable_entry"

[[systemAnalyses.consensus-orchestrator-wal.result.explanations]]
md = "The log is opened with sequence 0 while `Msg::Reset(1)` (wal.rs:101-104) moves the actor to height 1 without touching the log's sequence number. The orchestrator's prevote is then appended, and `write_entry` stamps the entry with the actor's height, 1. The log's sequence says the file belongs to height 0 while it holds an entry from height 1. Because `Msg::StartedHeight` decides between replaying and resetting purely by comparing the requested height against that sequence number, the mismatch is what lets height-1 data be replayed into a height-0 start."
property = "entries_belong_to_the_logs_height"

[[systemAnalyses.consensus-orchestrator-wal.result.interface]]
excludingCondition = "Wal actor Msg::Append (wal.rs:107-120): when height differs from actor.height the entry is dropped and the caller is answered Ok(()) — the message never reaches the log thread"
message = "Effect::WalAppend carrying a vote entry for a height other than the actor's current in-memory height"
noTest = true
senderAction = "onVote / onProposal / onProposedValue / onTimeoutElapsed / propose — the orchestrator's vote paths, via handle/vote.rs:95-102"

[[systemAnalyses.consensus-orchestrator-wal.result.interface]]
excludingCondition = "The write-ahead log has no action that accepts a proposal; only vote entries reach Msg::Append, so a proposal is never written to the log and cannot be reproduced by a replay"
message = "Effect::PublishProposal — the locally built proposal the orchestrator broadcasts"
noTest = true
senderAction = "propose — handle/propose.rs, recorded by the orchestrator as EffPublishProposal"

