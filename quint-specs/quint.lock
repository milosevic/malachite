[[components.equivocation-detection.productIntent.goals]]
claim = "It should be possible to receive the same pair of conflicting votes repeatedly and end with exactly one evidence record for that validator."
decidedAt = 1788340823724
decision = "rejected"
expectations = [
    "`evidence.votes[v1].length` stays `1` no matter how often `voteB` is redelivered",
    "`evidence.add(voteB, voteA)` is also absorbed by the same-pair check",
    "`MisbehaviorEvidence.votes` handed to the application at finalize carries one record per conflicting pair",
]
headline = "Replayed equivocation is recorded once"
id = "replayed-equivocation-is-recorded-once"
quint = [
    "val dedupedBothOrders =",
    "  evidence.get(v1).length() == 1",
    "run replayEquivocation =",
    "  init.then(applyVote(voteA)).then(applyVote(voteB)).then(applyVote(voteB))",
    "    .expect(evidence.get(v1).length() == 1)",
]
why = "Slashing on duplicated records would punish one offence many times, so the dedup is what keeps evidence proportional to actual misbehavior."

