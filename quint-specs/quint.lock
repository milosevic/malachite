    "Round::Nil passed where Timeouts::duration_for expects a defined round (panics)",
    "Height decrement below the minimum height",
]
specHints = "All quorum math is threshold.rs:52-88 — is_met's strict '>' and min_expected's floor division are the two places an off-by-one would hide, and they are not obviously consistent with each other. certificate.rs:138-183 is the verification error vocabulary (verification itself lives in core-consensus). validator_set.rs is a trait with no in-crate enforcement of the ordering or dedup it documents. utils/height.rs and height_params.rs carry the height-window helpers. ser.rs and ser/borsh.rs belong to message-codec."
