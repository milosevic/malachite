[[components.equivocation-detection.hardToReproduce]]
revision = 9
kind = "code"
problem = """
STALE TARGET plus a non-enforceable contract.

(1) Stale. The queued subject is guardId 1617 / ruleId \"1620.1623.1626.1629.1632|\", violatedBy [\"evidence::store_proposal_surfaces_equivocation_to_caller\"]. Those ids do not exist in the current live report (.../reports/26d743ab/equivocation-detection/live/report.json): its guardScenarios list has exactly one entry for `proposalPairCount(pk.evidence) > 0` on `read_proposal_evidence`, guardId 1679 / ruleId \"1682.1685.1688.1691.1694|\", with \"status\":\"untested\", \"testedBy\":[], \"violatedBy\":[]. The named test now replays cleanly: its resolvedPaths show steps store_proposal x3 (rule 1368.1379.1406.1409.1412|1399), record_proposal_evidence, proposal_evidence_add (ghost.proposalPairs=1), then read_proposal_evidence at step 5 with the guard TRUE, matching family [1]. The crossing was an artifact of the earlier instrumentation revision, in which computing the `store_proposal` assertion values went through `ProposalKeeper::evidence()` and emitted a nested read while the map was empty; that was repaired by adding the non-logging `pub(crate) fn evidence_counts(&self)` accessor in code/crates/core-driver/src/proposal_keeper.rs (used by `store_proposal`'s oracle block). The coverage-investigation.json finding for guardId 1679 records the same conclusion, verdict \"benign\", suggestedAction \"none\".

(2) Even if it were live, there is no contract to assert. `ProposalKeeper::evidence()` (core-driver/src/proposal_keeper.rs) returns `&EvidenceMap<Ctx>` — infallible, no Result, no panic. An empty read is legitimate and happens on every height with no misbehaviour (core-consensus/src/handle/finalize.rs log_and_finalize reads it unconditionally); core-driver/tests/it/evidence.rs already does `assert!(keeper.evidence().is_empty())`. A contract-assertion test would have to assert `is_err()` on an API that cannot fail. The guard models the instrumentation choice `if quint_oracle::enabled() && !self.evidence.is_empty()` — \"only report a read that hands out evidence\" — not a rejection the code performs."""
summary = "Reading the proposal evidence map while it holds nothing cannot be tested as a rejection: the accessor just hands back an empty map, and there is no error to assert. The flagged crossing no longer happens."

