[[components.wal.productIntent.hazards]]
claim = "It should be impossible to reach a state where opening the log permanently deletes entries whose CRC is still valid."
decidedAt = 1788009265929
decision = "confirmed"
expectations = [
    "the open scan never checks any `CRC`, so a corrupt `lengthField` is indistinguishable from a short entry",
    "`storage.truncate_to(pos)` deletes entries `4` and `5` before any caller can inspect them",
    "`open` returns `Ok` and the caller is given a log it believes is complete",
]
headline = "Open never discards intact entries"
id = "open-never-discards-intact-entries"
quint = [
    "val openKeepsIntactEntries =",
    "  entriesBefore.filter(e => e.crc == Valid).forall(e => entriesAfterOpen.contains(e))",
]
why = "Interior corruption silently eats the undamaged tail, so replay reconstructs a stale consensus state and the node can equivocate."

