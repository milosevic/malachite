headline = "Replay keeps undamaged later entries"
kind = "hazard"
note = "The hazard is present in the code (LogIter stops after the first read error and fetch_entries breaks and truncates the log at that index) and corruption.rs actively asserts that stop-and-truncate behavior, so no existing test would fail if later intact entries were discarded."
recordedAt = 1788009293701
