version = 1

[survey]
date = "2026-09-11T10:07:36Z"
schema = 1

[system]
systemId = "malachite"

[[system.composition]]
name = "Reaching consensus across validators"
shape = "many-to-many"

[[system.composition.roleGroups]]
role = "validator"
componentKey = "consensus-orchestrator"
cardinality = "many"
correctnessAssumption = "at most f faulty"
note = "n = 3f+1 by voting power, not by count; the tolerated budget is expressed as a voting-power fraction in ThresholdParam"

[[system.composition.roleGroups]]
role = "transport"
componentKey = "p2p-network"
cardinality = "many"
correctnessAssumption = "none required"
note = "gossip may reorder, duplicate and delay; eventual delivery between correct peers is the liveness assumption"

[[system.composition.roleGroups]]
role = "domain"
componentKey = "core-types-domain"
cardinality = 1
note = "the shared quorum arithmetic and validator set every validator evaluates identically"

[[system.composition.groupProperties]]
name = "Agreement"
statement = "No two correct validators decide different values at the same height, even when up to f of the voting power is byzantine."

[[system.composition.groupProperties]]
name = "Validity"
statement = "Any decided value was proposed by the proposer for some round of that height and passed the application's validity check."

[[system.composition.groupProperties]]
name = "Termination"
statement = "Every correct validator eventually decides at each height, provided messages between correct validators are eventually delivered."

[[system.composition.groupProperties]]
name = "Quorum intersection"
statement = "Any two sets of validators each holding more than 2/3 of the voting power share at least one correct validator, which is what makes conflicting decisions impossible."

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "core-types-domain"
requirement = "Quorum is strictly more than 2/3 of total voting power, and every correct validator computes the same proposer for a given (height, round) — a strict-vs-non-strict inequality or a non-deterministic proposer breaks agreement outright."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "p2p-network"
requirement = "A message broadcast by a correct validator is eventually delivered to every correct validator, and the network never fabricates a message attributed to a validator that did not send it."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "p2p-network"
provider = "core-types-domain"
requirement = "The validator set the network layer classifies peers against is the same set consensus is running with at that height."
status = "unchecked"

[[system.composition]]
name = "Driving one height to a decision"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "consensus-orchestrator"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "driver"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "vote-keeper"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "round-state-machine"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "core-types-domain"
cardinality = 1

[[system.composition.groupProperties]]
name = "Single decision"
statement = "One height produces at most one decided value, no matter how inputs interleave or how many rounds it takes."

[[system.composition.groupProperties]]
name = "Locking"
statement = "A validator never precommits a value that contradicts a value it has locked, unless it has seen a polka for the new value in a later round."

[[system.composition.groupProperties]]
name = "Threshold once"
statement = "Each threshold event reaches the round state machine at most once per round, so a repeated vote cannot drive a second transition."

[[system.composition.groupProperties]]
name = "Cascade termination"
statement = "One external input drives the pending-input cascade to a fixed point and returns, rather than looping forever."

[[system.composition.bridgeChecks]]
assumer = "driver"
provider = "vote-keeper"
requirement = "Every threshold output is emitted at most once per (round, vote type, value), because the driver treats each one as a fresh round-state-machine input."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "driver"
provider = "round-state-machine"
requirement = "apply() never panics on the inputs the multiplexer can produce — in particular the pol_round asserts in prevote()/prevote_previous() must be unreachable given how mux.rs routes proposals."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "driver"
requirement = "process() returns a complete output list with the pending-input cascade already drained, so the orchestrator never has to re-enter the driver to reach a fixed point."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "vote-keeper"
provider = "core-types-domain"
requirement = "ThresholdParam::is_met does not panic on the weight sums a real validator set can produce, and treats the exact 2/3 boundary as not met."
status = "unchecked"

[[system.composition]]
name = "Surviving a crash"
shape = "two-party"

[[system.composition.roleGroups]]
role = "consensus"
componentKey = "consensus-orchestrator"
cardinality = 1

[[system.composition.roleGroups]]
role = "log"
componentKey = "wal"
cardinality = 1

[[system.composition.groupProperties]]
name = "No amnesia"
statement = "A validator that crashes and restarts never contradicts a vote it published before the crash, because every vote is durably logged before it is sent."

[[system.composition.groupProperties]]
name = "Replay fidelity"
statement = "Replaying the WAL for a height reproduces exactly the votes and proposals the node had already published at that height — no more and no fewer."

[[system.composition.groupProperties]]
name = "Height isolation"
statement = "Entries from a previous height are never replayed into a later one."

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "wal"
requirement = "Effect::WalAppend has durably committed the entry before the corresponding message is published — an Append that is silently dropped because the actor's height moved on would break the no-amnesia property."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "wal"
provider = "consensus-orchestrator"
requirement = "The orchestrator issues StartedHeight before any Append for that height, so the log's sequence number always matches the height being appended to."
status = "unchecked"

[[system.composition]]
name = "Catching up a lagging node"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "value-sync"
cardinality = 1
note = "the client side, on the node that fell behind"

[[system.composition.roleGroups]]
role = "server"
componentKey = "p2p-network"
cardinality = "many"
correctnessAssumption = "none required"
note = "peers may lie about their tip or serve wrong values; the client must not trust them"

[[system.composition.roleGroups]]
role = "consumer"
componentKey = "consensus-orchestrator"
cardinality = 1

[[system.composition.roleGroups]]
role = "verifier"
componentKey = "core-types-domain"
cardinality = 1

[[system.composition.groupProperties]]
name = "Safe catch-up"
statement = "A node that catches up by sync ends in the same decided-value sequence as a node that reached those heights by voting."

[[system.composition.groupProperties]]
name = "No gaps"
statement = "Synced heights are applied contiguously, so the node never decides height h+1 without having decided h."

[[system.composition.groupProperties]]
name = "Progress"
statement = "Every open request eventually completes or is retried against a different peer, so one unresponsive peer cannot stall catch-up."

[[system.composition.groupProperties]]
name = "Bounded trust"
statement = "A lying peer costs at most a retry and a score penalty; it can never cause a wrong value to be decided."

[[system.composition.bridgeChecks]]
assumer = "value-sync"
provider = "consensus-orchestrator"
requirement = "Every synced value is verified against its commit certificate before it is decided — sync itself performs no signature verification, and decide.rs's sync path currently skips the local re-verification that the voting path performs."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "value-sync"
requirement = "Values are delivered to consensus in contiguous ascending height order, with no gaps and no repeats."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "value-sync"
provider = "p2p-network"
requirement = "A response is attributable to the peer the request was sent to, so the peer-identity check on responses is meaningful."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "value-sync"
provider = "core-types-domain"
requirement = "A commit certificate carrying more than 2/3 of the voting power for a value cannot be forged by peers holding at most f of it."
status = "unchecked"

[[system.composition]]
name = "Disseminating a proposal in parts"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "proposal-streaming"
cardinality = 1
note = "the proposer, streaming INIT / DATA* / FIN"

[[system.composition.roleGroups]]
role = "receiver"
componentKey = "consensus-orchestrator"
cardinality = "many"
correctnessAssumption = "at most f faulty"

[[system.composition.roleGroups]]
role = "transport"
componentKey = "p2p-network"
cardinality = "many"
correctnessAssumption = "none required"

[[system.composition.roleGroups]]
role = "codec"
componentKey = "message-codec"
cardinality = 1

[[system.composition.groupProperties]]
name = "Same value"
statement = "Every correct receiver that reassembles a stream ends with the identical value the proposer sent, despite out-of-order and duplicated parts."

[[system.composition.groupProperties]]
name = "Complete or nothing"
statement = "A value is handed to consensus only once every part between INIT and FIN has arrived — a partial proposal is never voted on."

[[system.composition.groupProperties]]
name = "Bounded buffering"
statement = "An incomplete or abandoned stream does not accumulate parts without limit."

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "proposal-streaming"
requirement = "A reassembled value is delivered at most once per stream, so the proposal-versus-value race in the full proposal keeper resolves to a single entry."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "proposal-streaming"
provider = "message-codec"
requirement = "Each part decodes to exactly the content it was encoded from, so sequence numbers and the FIN marker survive the wire intact."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "proposal-streaming"
provider = "p2p-network"
requirement = "Parts may be reordered or duplicated but are not truncated mid-part, and a stream id is not reused concurrently by two senders."
status = "unchecked"

[[system.composition]]
name = "Building and keeping the peer set"
shape = "many-to-many"

[[system.composition.roleGroups]]
role = "peer"
componentKey = "peer-discovery"
cardinality = "many"
correctnessAssumption = "none required"
note = "expect adversarial peers attempting sybil, address poisoning and dial storms"

[[system.composition.roleGroups]]
role = "peer"
componentKey = "p2p-network"
cardinality = "many"
correctnessAssumption = "none required"

[[system.composition.roleGroups]]
role = "prover"
componentKey = "validator-proof-protocol"
cardinality = "many"

[[system.composition.roleGroups]]
role = "verifier"
componentKey = "signing"
cardinality = 1

[[system.composition.groupProperties]]
name = "Connectivity"
statement = "Correct nodes converge on a connected overlay in which every correct validator can reach every other."

[[system.composition.groupProperties]]
name = "Sybil resistance"
statement = "An adversary controlling one IP or many fresh peer ids cannot displace the honest peers a node is connected to."

[[system.composition.groupProperties]]
name = "Honest classification"
statement = "A peer is treated as a validator only after a proof signed by a key in the current validator set has been verified."

[[system.composition.bridgeChecks]]
assumer = "p2p-network"
provider = "validator-proof-protocol"
requirement = "A ProofReceived event carries a proof that has actually been verified, since record_verified_proof grants validator classification without re-checking."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "validator-proof-protocol"
provider = "signing"
requirement = "verify_validator_proof rejects a proof replayed from another network or another peer — the proof preimage deliberately carries no network domain prefix."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "p2p-network"
provider = "peer-discovery"
requirement = "Discovery never hands the network layer an address it has not actually dialed successfully, so persistent-peer status cannot be claimed by assertion."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "peer-discovery"
provider = "p2p-network"
requirement = "Connection and per-IP limits are enforced beneath discovery, so discovery's own concurrency bound is not the only thing standing between the node and a dial storm."
status = "unchecked"

[[system.composition]]
name = "Holding validators accountable"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "equivocation-detection"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "vote-keeper"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "driver"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "consensus-orchestrator"
cardinality = 1

[[system.composition.roleGroups]]
role = "adversary"
componentKey = "byzantine-fault-injection"
cardinality = 1
note = "the injected misbehavior this composition exists to catch"

[[system.composition.groupProperties]]
name = "Detection"
statement = "A validator that sends two conflicting votes or proposals for one (height, round) is reported in the evidence delivered with that height's decision."

[[system.composition.groupProperties]]
name = "No double count"
statement = "An equivocating message is recorded as evidence instead of being tallied, so equivocation cannot manufacture a quorum."

[[system.composition.groupProperties]]
name = "Evidence integrity"
statement = "Each piece of evidence names one validator and exactly two conflicting messages it actually signed, so an honest validator can never be accused."

[[system.composition.groupProperties]]
name = "Delivered once"
statement = "Evidence for a height is delivered exactly once, at finalization, and is not lost if the node restarts mid-height."

[[system.composition.bridgeChecks]]
assumer = "equivocation-detection"
provider = "vote-keeper"
requirement = "Both conflicting votes are retained when equivocation is detected, since evidence needs the pair and the keeper's normal path keeps only the first."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "equivocation-detection"
provider = "driver"
requirement = "take_vote_evidence and take_proposal_evidence drain everything accumulated for the height, and nothing is pruned out from under them by prune_votes_and_certificates."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "equivocation-detection"
requirement = "Evidence is available at finalize time for the height being finalized, not for whichever height the driver has since moved to."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "equivocation-detection"
provider = "byzantine-fault-injection"
requirement = "The injected equivocation produces two genuinely distinct, validly signed messages for one (height, round), which is what detection is defined against."
status = "unchecked"

[[system.composition]]
name = "Putting messages on the wire"
shape = "clique"

[[system.composition.roleGroups]]
role = "member"
componentKey = "message-codec"
cardinality = 1

[[system.composition.roleGroups]]
role = "member"
componentKey = "signing"
cardinality = 1

[[system.composition.roleGroups]]
role = "member"
componentKey = "core-types-domain"
cardinality = 1

[[system.composition.groupProperties]]
name = "Faithful transfer"
statement = "A signed message that is encoded, sent, decoded and verified on another node carries exactly the vote or proposal its signer intended."

[[system.composition.groupProperties]]
name = "No forgery"
statement = "No sequence of bytes an adversary can produce verifies as a message signed by a validator whose key it does not hold."

[[system.composition.groupProperties]]
name = "No confusion"
statement = "A message signed for one purpose does not verify as a message of another purpose, and a value encoded as one message type does not decode as another."

[[system.composition.bridgeChecks]]
assumer = "signing"
provider = "message-codec"
requirement = "The bytes signed and the bytes verified are produced by the same canonical encoding — any encoding non-determinism makes valid signatures fail or invalid ones pass."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "message-codec"
provider = "core-types-domain"
requirement = "Every domain value has exactly one canonical encoding, so round-tripping is identity rather than merely equivalent."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "core-types-domain"
provider = "signing"
requirement = "Signature verification is total over arbitrary byte input, returning Invalid rather than panicking, since certificate verification calls it on attacker-supplied data."
status = "unchecked"

[[system.composition]]
name = "Running an application on consensus"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "app-integration"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "engine-actors"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "consensus-orchestrator"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "example-app"
cardinality = 1

[[system.composition.roleGroups]]
role = "satellite"
componentKey = "node-config"
cardinality = 1

[[system.composition.groupProperties]]
name = "Reply discipline"
statement = "Every request the engine makes of the application is answered, so consensus is never blocked waiting on the app."

[[system.composition.groupProperties]]
name = "Durable before ack"
statement = "The application persists a decided value before acknowledging the decision, so a crash between the two cannot lose a commit."

[[system.composition.groupProperties]]
name = "Consistent limits"
statement = "The message-size and timeout bounds the application builds values against are the same ones the network and consensus layers enforce."

[[system.composition.groupProperties]]
name = "Clean restart"
statement = "A node restarted from its own persisted state rejoins at the right height without contradicting anything it did before."

[[system.composition.bridgeChecks]]
assumer = "consensus-orchestrator"
provider = "app-integration"
requirement = "GetValue is answered with a value for the requested height and round, within the proposal timeout — a late or mismatched reply is indistinguishable from a stalled proposer."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "app-integration"
provider = "engine-actors"
requirement = "Each HostMsg reply channel is consumed exactly once, so a reply is neither dropped nor delivered twice."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "example-app"
provider = "app-integration"
requirement = "Decided is delivered before the sync actor is told about the new height, so a sync peer never asks for a value the store has not yet written."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "engine-actors"
provider = "node-config"
requirement = "Configured timeouts and size limits are internally consistent — a proposal the app is allowed to build must fit within the pubsub size limit that will carry it."
status = "unchecked"

[[system.composition]]
name = "Testing the protocol under attack"
shape = "star"

[[system.composition.roleGroups]]
role = "center"
componentKey = "test-tooling"
cardinality = 1

[[system.composition.roleGroups]]
role = "adversary"
componentKey = "byzantine-fault-injection"
cardinality = 1

[[system.composition.roleGroups]]
role = "fixture"
componentKey = "test-harness"
cardinality = 1

[[system.composition.roleGroups]]
role = "subject"
componentKey = "consensus-orchestrator"
cardinality = "many"
correctnessAssumption = "at most f faulty"

[[system.composition.roleGroups]]
role = "subject"
componentKey = "wal"
cardinality = "many"

[[system.composition.groupProperties]]
name = "Faithful replay"
statement = "Every state a Quint trace prescribes is matched by the Rust implementation's state after the corresponding step, which is the refinement claim the MBT suite exists to enforce."

[[system.composition.groupProperties]]
name = "Attacks are real"
statement = "Injected misbehavior produces messages indistinguishable from a genuinely byzantine validator's, so passing under injection is evidence about the protocol and not about the harness."

[[system.composition.groupProperties]]
name = "Crash coverage"
statement = "A node killed and restarted mid-height rejoins and agrees with the nodes that stayed up."

[[system.composition.groupProperties]]
name = "Loud failure"
statement = "A divergence between spec and code fails the test rather than timing out or being silently compared away."

[[system.composition.bridgeChecks]]
assumer = "test-tooling"
provider = "consensus-orchestrator"
requirement = "The state a trace step compares against is fully observable from the implementation — a field the runner cannot see is a field the refinement claim does not actually cover."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "test-tooling"
provider = "test-harness"
requirement = "The concrete TestContext's proposer selection and validator ordering match what the Quint specs assume, since the specs are written against this context's semantics."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "byzantine-fault-injection"
provider = "test-harness"
requirement = "The middleware hooks fire at exactly the points where a real byzantine node would deviate, so no attack is silently a no-op."
status = "unchecked"

[[system.composition.bridgeChecks]]
assumer = "test-tooling"
provider = "wal"
requirement = "A crashed-and-restarted test node replays its WAL deterministically, so a failing crash test indicates a protocol bug rather than harness nondeterminism."
status = "unchecked"

