claim = "It should be impossible to reach a state where from_bytes accepts a payload that to_bytes cannot reproduce byte-for-byte."
expectations = [
    "`from_bytes` calls `Self::Proto::decode`, which skips fields whose tags this build does not know and keeps no record of them",
    "Neither `from_bytes` nor `to_bytes` compares the re-emitted bytes with the input, so the loss is silent",
    "A value whose signature was computed over `wire.payload` no longer verifies against `reencoded.bytes`",
]
headline = "Decode rejects bytes it cannot re-emit"
id = "decode-rejects-bytes-it-cannot-re-emit"
quint = [
    "val decodeIsCanonical =",
    "  payloads.forall(b =>",
    "    fromBytes(b).isOk implies toBytes(fromBytes(b).value) == b)",
]
recordedAt = 1788445489504
why = "Any message relayed by re-encoding — or any signature checked against locally re-serialized bytes — silently changes shape across a mixed-version network, which is exactly how a consensus fork starts."

